<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1525">
<meta name="description" content="PsicoBase - O espaço onde a mente humana é estudada com profundidade, método e acolhimento.">
<title>PsicoBase · Onde a Mente Humana é Estudada com Rigor e Acolhimento</title>

<!-- Tipografia: Lora (Editorial Clássico) + Plus Jakarta Sans (Ergonomia Digital) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   DESIGN SYSTEM PSICOBASE: EDITORIAL HUMANISTA CONTEMPORÂNEO
   ========================================================================== */
:root {
  /* Paleta Modo Claro: Estúdio de Pesquisa & Biblioteca Acolhedora */
  --bg-canvas: #F8F6F0;       /* Linho / Pergaminho suave (elimina fadiga ocular) */
  --bg-card: #FFFFFF;         /* Superfície de cartão pura */
  --bg-fichamento: #FAF8F4;   /* Tom de papel de ficha bibliográfica */
  --bg-sepia: #F3ECE1;       /* Sepia sutil para destaques */
  --fg-base: #242124;         /* Grafite quente e profundo */
  --fg-muted: #645D68;        /* Cinza grafite atenuado */
  --borda-suave: #E7E1D8;     /* Linha de encadernação clássica */
  --borda-foco: #7A5C91;

  /* Cores de Identidade & Afeto */
  --primaria: #4A1525;        /* Bordô / Vinho Clássico (rigor e história) */
  --primaria-hover: #380F1B;
  --primaria-tint: rgba(74, 21, 37, 0.07);
  --secundaria: #7A5C91;      /* Lavanda Aveludada / Ametista (psique e calmaria) */
  --secundaria-tint: rgba(122, 92, 145, 0.12);
  
  /* Cores Funcionais de Redução de Carga Mental */
  --salvia: #3A7356;          /* Verde Sálvia (foco sereno e acertos) */
  --salvia-tint: rgba(58, 115, 86, 0.12);
  --terracota: #BD6148;       /* Terracota Suave (atenção sem alarme punitivo) */
  --terracota-tint: rgba(189, 97, 72, 0.12);
  --ambar: #C28D38;           /* Ocre / Âmbar Antigo (conquistas e consistência) */
  --ambar-tint: rgba(194, 141, 56, 0.12);

  /* Sombras Táteis & Orgânicas */
  --sombra-card: 0 4px 16px rgba(50, 40, 35, 0.04), 0 1px 3px rgba(50, 40, 35, 0.03);
  --sombra-hover: 0 8px 26px rgba(50, 40, 35, 0.08), 0 2px 6px rgba(50, 40, 35, 0.04);
  --sombra-flutuante: 0 12px 36px rgba(74, 21, 37, 0.12);

  /* Tipografia & Métricas de Leitura */
  --font-serif: 'Lora', Georgia, 'Times New Roman', serif;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --leitura-max-ch: 70ch;
  --line-height-leitura: 1.72;
  --radius-card: 16px;
  --radius-pill: 9999px;

  /* Easing Orgânico Calm Tech (respiração) */
  --calm-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --duracao-rapida: 0.2s;
  --duracao-padrao: 0.35s;
}

body.escuro {
  /* Paleta Modo Escuro: Sessão Noturna de Leitura & Consultório Introspectivo */
  --bg-canvas: #131217;       /* Ardósia profunda com subtom roxo/índigo */
  --bg-card: #1E1B24;         /* Superfície de leitura noturna */
  --bg-fichamento: #25222D;
  --bg-sepia: #2B2633;
  --fg-base: #F4F1F7;
  --fg-muted: #A39BAA;
  --borda-suave: #302B3A;
  --borda-foco: #C7A7EC;

  --primaria: #E29BB0;        /* Bordô rosé acolhedor */
  --primaria-hover: #F0B3C4;
  --primaria-tint: rgba(226, 155, 176, 0.15);
  --secundaria: #C7A7EC;      /* Lavanda luminosa */
  --secundaria-tint: rgba(199, 167, 236, 0.16);

  --salvia: #66D39D;          /* Menta serena */
  --salvia-tint: rgba(102, 211, 157, 0.15);
  --terracota: #FF8A73;
  --terracota-tint: rgba(255, 138, 115, 0.15);
  --ambar: #F0BF65;
  --ambar-tint: rgba(240, 191, 101, 0.15);

  --sombra-card: 0 4px 20px rgba(0, 0, 0, 0.35);
  --sombra-hover: 0 8px 30px rgba(0, 0, 0, 0.5);
  --sombra-flutuante: 0 12px 40px rgba(0, 0, 0, 0.65);
}

/* Reset Universal com Foco em Fluidez */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }

body {
  margin: 0; padding: 0;
  font-family: var(--font-sans);
  background-color: var(--bg-canvas);
  color: var(--fg-base);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--duracao-padrao) var(--calm-ease), color var(--duracao-padrao) var(--calm-ease);
}
body.grande { font-size: 112%; }

/* ==========================================================================
   ESTILOS DE CABEÇALHO & IDENTIDADE VISUAL (PSI)
   ========================================================================== */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(248, 246, 240, 0.9);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--borda-suave);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transition: all var(--duracao-padrao) var(--calm-ease);
}
body.escuro .app-header { background: rgba(19, 18, 23, 0.9); }

.header-brand {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; color: var(--primaria);
  font-family: var(--font-serif); font-weight: 700; font-size: 1.35rem;
  letter-spacing: -0.01em;
}

/* Marca d'água / Símbolo Psi Minimalista */
.psi-emblem {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--primaria); color: #FFF;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600;
  box-shadow: 0 2px 8px rgba(74, 21, 37, 0.2);
  transition: transform var(--duracao-padrao) var(--calm-ease);
}
body.escuro .psi-emblem {
  background: var(--primaria-tint); color: var(--primaria);
  border: 1px solid var(--primaria);
}
.header-brand:hover .psi-emblem { transform: rotate(-5deg) scale(1.05); }

/* Pomodoro com Respiração & Pílula de Foco */
.pomo-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-card); border: 1px solid var(--borda-suave);
  padding: 6px 14px; border-radius: var(--radius-pill);
  font-family: var(--font-sans); font-size: 0.88rem; font-weight: 700;
  color: var(--primaria); box-shadow: var(--sombra-card);
  transition: all var(--duracao-padrao) var(--calm-ease);
}
.pomo-breath-circle {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--salvia);
  display: inline-block;
}
.pomo-pill.ativo .pomo-breath-circle {
  animation: pulseBreath 3s infinite var(--calm-ease);
}
@keyframes pulseBreath {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 10px var(--salvia); }
}

.btn-icon-subtle {
  background: none; border: none; cursor: pointer; color: inherit;
  padding: 2px 6px; font-size: 0.95rem; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background-color var(--duracao-rapida);
}
.btn-icon-subtle:hover { background: var(--primaria-tint); }

.header-actions { display: flex; align-items: center; gap: 10px; }

.btn-header {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-card); color: var(--fg-base);
  border: 1px solid var(--borda-suave); padding: 7px 14px;
  border-radius: var(--radius-pill); font-size: 0.86rem; font-weight: 600;
  cursor: pointer; transition: all var(--duracao-rapida) var(--calm-ease);
}
.btn-header:hover {
  border-color: var(--secundaria); background: var(--secundaria-tint);
  transform: translateY(-1px);
}

/* ==========================================================================
   NAVEGAÇÃO TÁTIL & SIDEBAR DESKTOP
   ========================================================================== */
nav.inferior {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(248, 246, 240, 0.95);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--borda-suave);
  display: flex; justify-content: space-around; z-index: 40;
  padding-bottom: env(safe-area-inset-bottom);
  transition: background var(--duracao-padrao) var(--calm-ease);
}
body.escuro nav.inferior { background: rgba(19, 18, 23, 0.95); }

nav.inferior a {
  flex: 1; text-align: center; padding: 10px 4px;
  font-size: 0.74rem; font-weight: 600; text-decoration: none;
  color: var(--fg-muted); display: flex; flex-direction: column;
  align-items: center; gap: 4px; min-height: 58px; justify-content: center;
  transition: color var(--duracao-rapida), transform var(--duracao-rapida);
}
nav.inferior a svg { width: 22px; height: 22px; stroke-width: 2.1; transition: stroke var(--duracao-rapida); }
nav.inferior a[aria-current="page"] { color: var(--primaria); font-weight: 700; }
nav.inferior a[aria-current="page"] svg { stroke: var(--primaria); }

.wrap {
  max-width: 860px; margin: 0 auto;
  padding: 24px 20px 100px;
}

/* Desktop Sidebar Editorial */
@media (min-width: 960px) {
  body { padding-left: 270px; padding-bottom: 0; }
  .app-header { left: 270px; width: calc(100% - 270px); }
  nav.inferior {
    top: 0; bottom: 0; left: 0; right: auto; width: 270px;
    flex-direction: column; justify-content: flex-start; gap: 6px;
    padding: 30px 18px; border-top: 0; border-right: 1px solid var(--borda-suave);
  }
  .nav-header-desktop {
    padding: 0 10px 24px; margin-bottom: 12px;
    border-bottom: 1px solid var(--borda-suave);
    display: flex; align-items: center; gap: 12px;
  }
  nav.inferior a {
    flex: none; flex-direction: row; justify-content: flex-start; gap: 14px;
    padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; min-height: 48px;
  }
  nav.inferior a[aria-current="page"] {
    background: var(--primaria-tint); color: var(--primaria);
    border-left: 4px solid var(--primaria); font-weight: 700;
  }
  .wrap { max-width: 980px; padding: 36px 44px 80px; }
}

/* ==========================================================================
   TIPOGRAFIA & CARDS COM TEXTURA DE FICHA BIBLIOGRÁFICA
   ========================================================================== */
h1, h2, h3, h4 {
  color: var(--fg-base); font-family: var(--font-serif);
  font-weight: 600; line-height: 1.3;
}
h1 {
  font-size: 2.15rem; margin: 0.4rem 0 1.2rem;
  letter-spacing: -0.025em; font-weight: 700;
}
h2 {
  font-size: 1.45rem; margin: 2rem 0 0.9rem;
  color: var(--primaria); border-bottom: 1px solid var(--borda-suave);
  padding-bottom: 6px;
}
h3 { font-size: 1.15rem; margin: 1.2rem 0 0.4rem; }

p {
  font-size: 1.05rem; line-height: var(--line-height-leitura);
  max-width: var(--leitura-max-ch);
}
.muted { color: var(--fg-muted); font-size: 0.92rem; }

/* Ficha Bibliográfica / Card Tátil */
.card {
  background: var(--bg-card);
  border: 1px solid var(--borda-suave);
  border-radius: var(--radius-card);
  padding: 24px; margin: 18px 0;
  box-shadow: var(--sombra-card);
  position: relative; overflow: hidden;
  transition: transform var(--duracao-padrao) var(--calm-ease), box-shadow var(--duracao-padrao) var(--calm-ease);
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--sombra-hover);
}

/* Watermark de Psi para cards nobres */
.card.destaque {
  border-left: 5px solid var(--primaria);
  background: linear-gradient(135deg, var(--bg-card) 70%, var(--bg-sepia) 100%);
}
.card.destaque::after {
  content: 'Ψ';
  position: absolute; right: -10px; bottom: -20px;
  font-family: var(--font-serif); font-size: 9rem; font-weight: 700;
  color: var(--primaria); opacity: 0.035; pointer-events: none;
  user-select: none; line-height: 1;
}

/* Botões Ergonômicos */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primaria); color: #FFF; border: 2px solid var(--primaria);
  border-radius: 12px; padding: 11px 22px; font-family: var(--font-sans);
  font-weight: 600; font-size: 0.96rem; cursor: pointer; min-height: 46px;
  text-decoration: none; margin: 4px 6px 4px 0;
  box-shadow: 0 2px 8px rgba(74, 21, 37, 0.16);
  transition: all var(--duracao-rapida) var(--calm-ease);
}
.btn:hover {
  background: var(--primaria-hover); border-color: var(--primaria-hover);
  text-decoration: none; transform: translateY(-1.5px);
  box-shadow: 0 4px 12px rgba(74, 21, 37, 0.24);
}
.btn.sec {
  background: transparent; color: var(--primaria);
  border-color: var(--borda-suave); box-shadow: none;
}
.btn.sec:hover {
  background: var(--primaria-tint); border-color: var(--primaria);
}
.btn.sm {
  padding: 6px 14px; font-size: 0.86rem; min-height: 36px; border-radius: 8px;
}

/* Tags de Fichamento */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--bg-sepia); color: var(--fg-base);
  padding: 4px 12px; border-radius: var(--radius-pill);
  font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; border: 1px solid var(--borda-suave);
}
.tag.concluido { background: var(--salvia-tint); color: var(--salvia); border-color: transparent; }
.tag.pendente { background: var(--primaria-tint); color: var(--primaria); border-color: transparent; }

/* Barra de Progresso Suave */
.barra {
  height: 7px; background: var(--borda-suave);
  border-radius: var(--radius-pill); overflow: hidden; margin: 10px 0;
}
.barra > div {
  height: 100%; background: var(--salvia);
  transition: width 0.5s var(--calm-ease);
}

/* Grades Táteis */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin: 18px 0; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin: 16px 0; }

.stat-box {
  background: var(--bg-card); border: 1px solid var(--borda-suave);
  border-radius: var(--radius-card); padding: 18px; text-align: center;
  box-shadow: var(--sombra-card);
}
.stat-box .num {
  font-family: var(--font-serif); font-size: 1.85rem; font-weight: 700;
  color: var(--primaria); display: block; line-height: 1.15;
}
.stat-box .rotulo {
  font-size: 0.8rem; font-weight: 700; color: var(--fg-muted);
  text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; display: block;
}

/* ==========================================================================
   SELOS CONCEITUAIS DOS 12 EIXOS TEMÁTICOS (MÓDULOS)
   ========================================================================== */
.modulo-card {
  position: relative; border-radius: var(--radius-card);
  background: var(--bg-card); border: 1px solid var(--borda-suave);
  padding: 24px; box-shadow: var(--sombra-card);
  transition: all var(--duracao-padrao) var(--calm-ease);
  overflow: hidden;
}
.modulo-card:hover { transform: translateY(-3px); box-shadow: var(--sombra-hover); }

/* Selos conceituais táteis no topo do card */
.modulo-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--borda-suave);
}
.modulo-card[data-mod="1"]::before { background: linear-gradient(90deg, var(--primaria), var(--secundaria)); }
.modulo-card[data-mod="2"]::before { background: var(--ambar); } /* História */
.modulo-card[data-mod="3"]::before { background: var(--primaria); } /* Psicanálise e Abordagens */
.modulo-card[data-mod="4"]::before { background: linear-gradient(90deg, #9D71E8, #3A7356); } /* Neurociências */
.modulo-card[data-mod="5"]::before { background: var(--secundaria); } /* Processos Básicos */
.modulo-card[data-mod="6"]::before { background: #2F6F9F; } /* Behaviorismo/Aprendizagem */
.modulo-card[data-mod="7"]::before { background: var(--salvia); } /* Desenvolvimento */
.modulo-card[data-mod="8"]::before { background: #D97736; } /* Social */
.modulo-card[data-mod="9"]::before { background: #8E4A49; } /* Personalidade */
.modulo-card[data-mod="10"]::before { background: #45625D; } /* Metodologia Científica */
.modulo-card[data-mod="11"]::before { background: var(--ambar); } /* Ética CFP */
.modulo-card[data-mod="12"]::before { background: var(--terracota); } /* Psicopatologia */

/* ==========================================================================
   FLASHCARD 3D CLÁSSICO (REPETIÇÃO ESPAÇADA)
   ========================================================================== */
.flashcard-wrap { perspective: 1200px; margin: 28px 0; }
.flashcard {
  background: var(--bg-card); border: 2px solid var(--borda-suave);
  border-radius: 20px; min-height: 280px; padding: 36px 30px;
  box-shadow: var(--sombra-hover); cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; transition: transform 0.6s var(--calm-ease);
  transform-style: preserve-3d; position: relative; user-select: none;
}
.flashcard.virado { transform: rotateY(180deg); }
.flashcard-lado { position: relative; backface-visibility: hidden; width: 100%; }
.flashcard-verso {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 36px 30px;
  backface-visibility: hidden; transform: rotateY(180deg);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: var(--bg-fichamento); border-radius: 18px;
}
.flashcard h2 { font-family: var(--font-serif); border: none; padding: 0; }

/* ==========================================================================
   MODO FOCO ZEN DE LEITURA (AULA SEM DISTRAÇÕES)
   ========================================================================== */
body.modo-zen {
  padding-left: 0 !important;
  background-color: #FAF8F5;
}
body.escuro.modo-zen { background-color: #111014; }

body.modo-zen .app-header,
body.modo-zen nav.inferior {
  display: none !important;
}
body.modo-zen .wrap {
  max-width: 760px; padding: 50px 24px;
}
.btn-zen-toggle {
  position: fixed; right: 24px; bottom: 24px; z-index: 90;
  box-shadow: var(--sombra-flutuante);
}

/* ==========================================================================
   O PROFESSOR DIGITAL & BANNER ÉTICO CFP / CVV 188
   ========================================================================== */
.chat-container {
  display: flex; flex-direction: column; gap: 16px;
  margin: 20px 0; max-height: 520px; overflow-y: auto; padding-right: 8px;
}
.chat-msg { display: flex; gap: 14px; max-width: 90%; }
.chat-msg.prof { align-self: flex-start; }
.chat-msg.aluno { align-self: flex-end; flex-direction: row-reverse; }

.chat-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; flex-shrink: 0;
}
.chat-msg.prof .chat-avatar {
  background: var(--primaria); color: #FFF;
  box-shadow: 0 2px 8px rgba(74, 21, 37, 0.25);
}
.chat-msg.aluno .chat-avatar { background: var(--secundaria); color: #FFF; }

.chat-bubble {
  padding: 16px 22px; border-radius: 20px;
  font-size: 0.98rem; line-height: 1.68;
}
.chat-msg.prof .chat-bubble {
  background: var(--bg-card); border: 1px solid var(--borda-suave);
  border-top-left-radius: 4px; box-shadow: var(--sombra-card);
}
.chat-msg.aluno .chat-bubble {
  background: var(--primaria); color: #FFFFFF;
  border-top-right-radius: 4px;
}
body.escuro .chat-msg.aluno .chat-bubble { background: var(--secundaria); color: #FFF; }

/* Banner Ético Permanente */
.banner-etico {
  background: var(--bg-sepia); border: 1px solid var(--borda-suave);
  border-radius: 12px; padding: 12px 18px; margin-top: 14px;
  font-size: 0.84rem; display: flex; align-items: center; gap: 12px;
  color: var(--fg-muted);
}
.banner-etico strong { color: var(--primaria); }

/* Inputs e Formulários */
.campo {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--borda-suave); background: var(--bg-card); color: var(--fg-base);
  font: inherit; font-size: 0.96rem; transition: all var(--duracao-rapida) var(--calm-ease);
}
.campo:focus {
  outline: none; border-color: var(--primaria);
  box-shadow: 0 0 0 3px var(--primaria-tint);
}

.toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: #242124; color: #FFFFFF; padding: 12px 24px; border-radius: 30px;
  z-index: 9999; max-width: 90%; font-size: 0.92rem; font-weight: 600;
  box-shadow: var(--sombra-flutuante); animation: fadeUp 0.3s var(--calm-ease);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translate(-50%, 15px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* Opções de Seleção & Quizzes (.alt) */
.alt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 18px;
  margin: 10px 0;

<script>
(()=>{
'use strict';

/* ==================== DADOS CURRICULARES (47 AULAS E GLOSSÁRIO) ==================== */
const CHAVE='psicobase-v1';
const INTERVALOS=[1,3,7,14,30];
const LETRAS=['a','b','c','d'];
const NIVEIS={nunca:'Nunca estudei Psicologia',conheco:'Conheço alguns conceitos',intermediario:'Já tenho conhecimentos intermediários',cursando:'Já estou cursando Psicologia'};
const OBJETIVOS={preparacao:'Preparação para a faculdade',revisao:'Revisão dos fundamentos',graduacao:'Acompanhamento da graduação',interesse:'Estudos por interesse pessoal'};
const TEMPOS={'10':'10 minutos por dia','20':'20 minutos por dia','30':'30 minutos por dia','45':'45 minutos por dia','60':'60 minutos ou mais'};
const PREFS={leitura:'Leitura',questoes:'Questões',flashcards:'Flashcards',mapas:'Mapas conceituais (em breve)',ia:'Professor virtual (opcional)',casos:'Estudos de casos hipotéticos'};

const MODULOS=[
 {id:1,titulo:'Introdução à Psicologia',desc:'O que é a Psicologia, seus campos e seus limites.'},
 {id:2,titulo:'História da Psicologia',desc:'Das origens filosóficas às escolas do século XX.'},
 {id:3,titulo:'Teorias e abordagens psicológicas',desc:'Psicanálise, behaviorismo, cognitivismo, humanismo e outras.'},
 {id:4,titulo:'Neurociência e bases biológicas',desc:'Neurônios, sinapses, estruturas cerebrais e comportamento.'},
 {id:5,titulo:'Processos psicológicos básicos',desc:'Sensação, percepção, atenção, memória, emoção e pensamento.'},
 {id:6,titulo:'Aprendizagem e comportamento',desc:'Condicionamento clássico, operante e aprendizagem observacional.'},
 {id:7,titulo:'Psicologia do desenvolvimento',desc:'Desenvolvimento humano da infância ao envelhecimento.'},
 {id:8,titulo:'Psicologia social',desc:'Grupos, normas, influência social e preconceito.'},
 {id:9,titulo:'Personalidade e diferenças individuais',desc:'Traços, temperamento e mensuração psicológica.'},
 {id:10,titulo:'Metodologia científica',desc:'Hipóteses, variáveis, delineamentos e leitura de artigos.'},
 {id:11,titulo:'Ética, profissão e Psicologia no Brasil',desc:'Código de Ética, sigilo, políticas públicas e atuação.'},
 {id:12,titulo:'Introdução à psicopatologia e saúde mental',desc:'Saúde mental em perspectiva biopsicossocial. Conteúdo estritamente educacional.'}
];

const GLOSSARIO=[
 {termo:'Afeto',simples:'Termo geral para emoções, humor e sentimentos.',academico:'Fenômenos de experiência subjetiva associados à valência e à intensidade de estados emocionais e de humor.',exemplo:'A tristeza após uma perda é um afeto que pode ser estudado em pesquisas sobre luto.'},
 {termo:'Cognição',simples:'Conjunto de processos mentais de conhecimento: atenção, percepção, memória, linguagem e pensamento.',academico:'Processos de aquisição, transformação e uso de informação pelo organismo, geralmente inferidos a partir do comportamento e de medidas indiretas.',exemplo:'Lembrar o caminho até a faculdade envolve memória e representação espacial.'},
 {termo:'Comportamento',simples:'Ações observáveis de um organismo em interação com o ambiente.',academico:'Qualquer atividade observável ou mensurável de um organismo em relação ao seu contexto; na Análise do Comportamento, é a unidade central de estudo.',exemplo:'Abrir um livro para estudar é um comportamento observável.'},
 {termo:'Condicionamento',simples:'Aprendizagem por associação entre eventos ou por suas consequências.',academico:'Processo em que a probabilidade ou a força de uma resposta muda em função de relações entre estímulos (clássico) ou de consequências (operante).',exemplo:'Um som que anuncia comida e passa a provocar salivação ilustra o condicionamento clássico.'},
 {termo:'Epistemologia',simples:'Estudo sobre o conhecimento: como ele é obtido, justificado e quais são seus limites.',academico:'Ramo da filosofia que investiga os fundamentos, os métodos e os limites do conhecimento; em Psicologia, discute os pressupostos das teorias e dos métodos.',exemplo:'Discutir se o relato introspectivo é um método confiável é uma questão epistemológica.'},
 {termo:'Estímulo',simples:'Qualquer evento do ambiente ou do próprio organismo que pode ser percebido e influenciar o comportamento.',academico:'Evento físico ou químico detectável pelos sistemas sensoriais que pode modificar a atividade do organismo.',exemplo:'Um barulho repentino é um estímulo.'},
 {termo:'Neuroplasticidade',simples:'Capacidade do sistema nervoso de se modificar com a experiência.',academico:'Propriedade do sistema nervoso de alterar conexões e funções em resposta à experiência, à aprendizagem e a lesões.',exemplo:'Aprender um idioma novo está associado a mudanças nas conexões neurais.'},
 {termo:'Psicopatologia',simples:'Estudo dos transtornos mentais e do sofrimento psíquico.',academico:'Área que estuda processos, causas e manifestações de transtornos mentais dentro de quadros teóricos e classificatórios. É estudo acadêmico, não diagnóstico.',exemplo:'Estudar os critérios de um transtorno em aula é estudo acadêmico e não serve para diagnosticar ninguém.'},
 {termo:'Reforço',simples:'Consequência que aumenta a probabilidade de um comportamento.',academico:'No condicionamento operante, qualquer consequência que aumenta a frequência futura de uma resposta. Pode ser positivo (acréscimo de estímulo) ou negativo (retirada de estímulo aversivo).',exemplo:'Um elogio após um bom desempenho pode aumentar a chance de a pessoa repetir o estudo sistemático.'}
];

/* ==================== CONTEÚDO ACADÊMICO ====================
   Status: aulas elaboradas sem revisão de especialista.
   Referências marcadas como "a verificar" até confirmação. */
const AULAS={
 'm1-a1':{
  modulo:1, titulo:'O que é Psicologia?', nivel:'Iniciante', tempo:20, disciplina:'Introdução à Psicologia',
  objetivos:['Definir a Psicologia como ciência','Diferenciar a Psicologia do senso comum','Reconhecer a diversidade de abordagens'],
  previos:'Nenhum.',
  secoes:[
   {t:'Explicação inicial',p:[
    'A Psicologia é a ciência que estuda os processos mentais e o comportamento de seres humanos e de outros animais. Ela procura descrever, explicar e prever fenômenos como percepção, memória, emoção, aprendizagem e as relações entre pessoas.',
    'A palavra "ciência" é central aqui. Em Psicologia, as perguntas são formuladas de modo que possam ser testadas por observações e experimentos, e não apenas por opiniões. Isso não significa que as respostas sejam definitivas: o conhecimento psicológico, como o de outras ciências, é provisório e pode ser revisado.'
   ]},
   {t:'Desenvolvimento',p:[
    'O nome vem do grego: psykhé (alma, mente) e lógos (estudo, discurso). A origem não implica que a Psicologia estude uma alma no sentido religioso. Hoje ela trabalha com fenômenos observáveis, como o comportamento e as respostas fisiológicas, e com fenômenos inferidos, como pensamentos e emoções, acessados por medidas indiretas, como questionários, tarefas experimentais e observação sistemática.',
    'Costuma-se apontar 1879 como data simbólica da Psicologia como ciência experimental independente, quando Wilhelm Wundt instalou um laboratório em Leipzig, na Alemanha. Desde então, o campo se dividiu em muitas subáreas e abordagens teóricas, que você conhecerá nos próximos módulos.'
   ]},
   {t:'Exemplo',p:[
    'Imagine duas pessoas que, antes de uma prova, sentem o coração acelerar. O senso comum diria apenas que "estão nervosas". A Psicologia faz perguntas mais precisas: qual é a relação entre a ativação fisiológica, a interpretação que cada pessoa faz da situação e o desempenho na prova? Essas perguntas podem ser investigadas com medidas comparáveis, o que exige método.',
    'Este exemplo é hipotético e serve apenas para ilustrar a forma de pensar da Psicologia. Ele não descreve pessoas reais.'
   ]},
   {t:'Contexto científico',p:[
    'Uma teoria psicológica precisa poder ser confrontada com dados e revisada quando os dados não a sustentam. Também é preciso cuidado com generalizações: resultados obtidos com um grupo específico, como estudantes universitários de uma cidade, nem sempre valem para outros grupos. Por isso a pesquisa valoriza a replicação, isto é, a repetição de estudos por outros pesquisadores.',
    'Distinguir a Psicologia científica de crenças populares é uma das competências centrais de quem estuda o campo.'
   ]}
  ],
  autores:[
   {nome:'Wilhelm Wundt (1832–1920)',texto:'Associado à fundação do laboratório de Leipzig e à Psicologia experimental.'},
   {nome:'William James (1842–1910)',texto:'Autor de The Principles of Psychology (1890), obra influente sobre a consciência e o funcionamento mental.'}
  ],
  erros:[
   '"A Psicologia serve para ler mentes." Não: ela estuda processos mentais por meio de métodos e reconhece os limites das inferências.',
   '"Psicologia é só opinião." Não: o campo possui métodos de coleta, análise e replicação de dados.',
   '"Psicólogos e psiquiatras fazem a mesma coisa." Não: são profissões com formações e atribuições diferentes.'
  ],
  resumo:[
   'A Psicologia é uma ciência que estuda processos mentais e comportamento.',
   'O termo vem do grego, mas hoje se refere a fenômenos observáveis e inferidos.',
   'Wundt é associado ao início da Psicologia experimental (Leipzig, 1879).',
   'Afirmações psicológicas precisam de evidências, testes e replicação.',
   'Resultados têm limites de generalização, e o conhecimento é provisório.'
  ],
  referencias:[
   'Lei nº 4.119, de 27 de agosto de 1962. Dispõe sobre a formação em Psicologia e regulamenta a profissão de psicólogo.',
   'Schultz, D. P.; Schultz, S. E. História da psicologia moderna. Verificar a edição em português disponível.'
  ],
  questoes:[
   {id:'m1-a1-q1',enunciado:'Qual é a melhor definição de Psicologia apresentada nesta aula?',alts:['Estudo de sonhos e interpretação de símbolos.','Ciência que estuda processos mentais e o comportamento.','Prática exclusiva de atendimento clínico.','Estudo da estrutura do cérebro apenas.'],correta:1,justificativa:'A aula define a Psicologia como ciência dos processos mentais e do comportamento, com métodos próprios. Não se limita à clínica nem ao estudo do cérebro.'},
   {id:'m1-a1-q2',enunciado:'Por que a Psicologia precisa de método para analisar a ansiedade diante de provas?',alts:['Porque a experiência subjetiva não tem relação com o comportamento.','Porque é preciso testar relações entre variáveis com dados, em vez de depender só de impressões.','Porque a Psicologia só estuda animais.','Porque o método torna qualquer resultado definitivo.'],correta:1,justificativa:'Método permite comparar medidas e testar hipóteses. Impressões isoladas não bastam para estabelecer relações entre fatores como ativação fisiológica e desempenho.'},
   {id:'m1-a1-q3',enunciado:'Sobre a origem da palavra "psicologia", qual afirmação é correta?',alts:['Significa que a Psicologia estuda apenas a alma religiosa.','Vem do grego e, hoje, refere-se ao estudo de fenômenos observáveis e inferidos.','Foi criada no século XX sem relação com o grego.','Significa "estudo do cérebro".'],correta:1,justificativa:'O termo combina psykhé e lógos. Embora a origem seja antiga, o campo atual trabalha com fenômenos observáveis e inferidos, não com uma alma no sentido religioso.'},
   {id:'m1-a1-q4',enunciado:'Wilhelm Wundt é associado a qual marco histórico?',alts:['Fundação de um laboratório de Psicologia experimental em Leipzig.','Criação da psicanálise.','Formulação da teoria dos cinco grandes fatores.','Fundação do behaviorismo radical.'],correta:0,justificativa:'Wundt instalou um laboratório em Leipzig, em 1879, marco simbólico da Psicologia experimental. Os demais itens associam o nome a outras teorias ou autores.'},
   {id:'m1-a1-q5',enunciado:'Qual das perguntas abaixo é formulada de modo científico?',alts:['Psicólogos são pessoas sensíveis?','Existe relação entre ativação fisiológica e desempenho em provas, e em que condições?','A mente é boa ou má?','Quem tem olhos claros é mais inteligente?'],correta:1,justificativa:'A pergunta correta pode ser investigada com medidas e comparações. As demais são opinativas, vagas ou sem base em evidência.'},
   {id:'m1-a1-q6',enunciado:'Um pesquisador obteve um resultado com um grupo específico de estudantes. Qual cuidado é adequado?',alts:['Generalizá-lo automaticamente para toda a humanidade.','Considerá-lo definitivo, sem replicação.','Reconhecer os limites de generalização e buscar replicação.','Ignorá-lo, por ter sido obtido com um grupo.'],correta:2,justificativa:'Resultados de amostras específicas têm alcance limitado. A replicação e o reconhecimento de limites fazem parte do pensamento científico.'}
  ],
  cartoes:[
   {id:'m1-a1-c1',frente:'O que é Psicologia?',verso:'Ciência que estuda processos mentais e o comportamento humano e animal, por meio de métodos de observação e experimentação.'},
   {id:'m1-a1-c2',frente:'De onde vem o termo "psicologia"?',verso:'Do grego psykhé (alma, mente) e lógos (estudo). Hoje não significa estudo religioso da alma.'},
   {id:'m1-a1-c3',frente:'Com qual evento Wilhelm Wundt é associado?',verso:'Instalação de um laboratório de Psicologia experimental em Leipzig, em 1879.'},
   {id:'m1-a1-c4',frente:'Por que a Psicologia exige método?',verso:'Para testar hipóteses com dados, evitando depender apenas de impressões ou opiniões.'},
   {id:'m1-a1-c5',frente:'O que é generalização indevida?',verso:'Estender resultados de um grupo específico a outras populações sem evidências que sustentem essa extensão.'},
   {id:'m1-a1-c6',frente:'Qual lei regulamenta a profissão de psicólogo no Brasil?',verso:'A Lei nº 4.119, de 1962. Confirme a vigência de normas atuais antes de citá-las.'}
  ]
 },
 'm6-a1':{
  modulo:6, titulo:'Condicionamento clássico e operante', nivel:'Iniciante', tempo:25, disciplina:'Aprendizagem e Comportamento',
  objetivos:['Definir aprendizagem em sentido psicológico','Diferenciar condicionamento clássico e operante','Distinguir reforço negativo de punição'],
  previos:'Conceito de estímulo e de comportamento (ver Biblioteca).',
  secoes:[
   {t:'Explicação inicial',p:[
    'Aprendizagem, em sentido psicológico, é uma mudança relativamente duradoura no comportamento, ou na probabilidade de um comportamento, resultante da experiência. Não inclui mudanças passageiras causadas por cansaço ou por efeitos de substâncias.',
    'Dois modelos clássicos explicam parte dessa mudança: o condicionamento clássico, associado a Ivan Pavlov, e o condicionamento operante, associado a B. F. Skinner.'
   ]},
   {t:'Desenvolvimento',p:[
    'No condicionamento clássico, um estímulo que inicialmente não provoca uma resposta específica passa a provocá-la após repetidos emparelhamentos com um estímulo que já a provoca naturalmente. Na pesquisa de Pavlov com cães, o som de um sino (estímulo neutro), apresentado repetidamente antes da comida (estímulo incondicionado, que provoca salivação sem aprendizagem), passou a provocar salivação por si só. Nesse caso, o sino tornou-se estímulo condicionado e a salivação, resposta condicionada.',
    'No condicionamento operante, a probabilidade de um comportamento muda conforme suas consequências. Reforço é qualquer consequência que aumenta a probabilidade do comportamento; punição é a que a diminui. O reforço pode ser positivo (acréscimo de um estímulo) ou negativo (retirada de um estímulo aversivo).'
   ]},
   {t:'Exemplo',p:[
    'Considere um exemplo hipotético: uma pessoa aprende a fechar a janela quando o vento forte causa incômodo, porque isso faz o barulho cessar. Fechar a janela é mantido pelo reforço negativo, pois a retirada do estímulo aversivo aumenta a probabilidade do comportamento. Não se trata de punição: a punição reduziria a chance de a pessoa repetir a ação.'
   ]},
   {t:'Contexto científico',p:[
    'Os princípios do condicionamento foram estabelecidos em estudos experimentais com animais e humanos, e constituem uma das bases mais consolidadas da análise do comportamento. Ainda assim, eles não explicam sozinhos toda a aprendizagem humana. Linguagem, aprendizagem por observação e processos cognitivos também participam, como você verá em aulas futuras.',
    'Aplicações clínicas e educacionais desses princípios exigem avaliação cuidadosa e consideração ética.'
   ]}
  ],
  autores:[
   {nome:'Ivan Pavlov (1849–1936)',texto:'Estudos sobre reflexos condicionados; obra Conditioned Reflexes (1927).'},
   {nome:'B. F. Skinner (1904–1990)',texto:'Sistematizou o condicionamento operante; obra Science and Human Behavior (1953).'},
   {nome:'Albert Bandura (1925–2021)',texto:'Estudou a aprendizagem observacional; obra Social Learning Theory (1977).'}
  ],
  erros:[
   '"Reforço negativo é o mesmo que punição." Não: o reforço negativo aumenta o comportamento pela retirada de um estímulo aversivo; a punição diminui o comportamento.',
   '"Pavlov ensinou o cão a gostar do sino." O modelo descreve associação entre estímulos e respostas, e não necessariamente emoções.',
   '"Condicionamento é só recompensa e castigo." Ele envolve associações entre estímulos e consequências em contextos variados.'
  ],
  resumo:[
   'Aprendizagem é uma mudança relativamente duradoura resultante da experiência.',
   'No condicionamento clássico, um estímulo neutro passa a provocar uma resposta após emparelhamento.',
   'No condicionamento operante, as consequências alteram a probabilidade dos comportamentos.',
   'Reforço aumenta o comportamento; punição diminui.',
   'Reforço negativo não é punição, e os modelos não explicam sozinhos toda a aprendizagem humana.'
  ],
  referencias:[
   'Pavlov, I. P. (1927). Conditioned Reflexes. Oxford: Clarendon Press.',
   'Skinner, B. F. (1953). Science and Human Behavior. New York: Macmillan.',
   'Bandura, A. (1977). Social Learning Theory. Englewood Cliffs: Prentice-Hall.'
  ],
  questoes:[
   {id:'m6-a1-q1',enunciado:'No condicionamento clássico, o que é o estímulo incondicionado?',alts:['Um estímulo que, sem aprendizagem, provoca a resposta naturalmente, como a comida provocando salivação.','Um estímulo aprendido por associação.','Uma resposta aprendida.','Um reforço negativo.'],correta:0,justificativa:'O estímulo incondicionado provoca a resposta sem treino prévio. A resposta a ele é a resposta incondicionada.'},
   {id:'m6-a1-q2',enunciado:'No experimento de Pavlov, qual era o estímulo neutro antes do treino?',alts:['A comida.','A salivação.','O som de um sino.','O laboratório.'],correta:2,justificativa:'Antes do emparelhamento, o sino não provocava salivação. Após repetidos pareamentos com a comida, passou a provocá-la.'},
   {id:'m6-a1-q3',enunciado:'Segundo a aula, o que caracteriza o reforço negativo?',alts:['É uma forma de punição.','Retira um estímulo aversivo e, com isso, aumenta a probabilidade do comportamento.','Acrescenta um estímulo aversivo.','Diminui a probabilidade do comportamento.'],correta:1,justificativa:'No reforço negativo, o comportamento é fortalecido porque algo desagradável é retirado. Isso o diferencia da punição, que enfraquece o comportamento.'},
   {id:'m6-a1-q4',enunciado:'Qual afirmação sobre a punição está correta?',alts:['Ela é sempre física.','Ela reduz a probabilidade de um comportamento.','Ela aumenta o comportamento.','Ela é sinônimo de reforço negativo.'],correta:1,justificativa:'A punição, em qualquer de suas formas, busca diminuir a probabilidade do comportamento. Não se restringe a agressões físicas nem equivale ao reforço negativo.'},
   {id:'m6-a1-q5',enunciado:'Qual exemplo ilustra um reforço positivo?',alts:['Retirar um barulho logo após o comportamento.','Receber um elogio após uma resposta correta, aumentando a chance de repetição.','Receber um castigo após um erro.','Ser ignorado após o comportamento.'],correta:1,justificativa:'Reforço positivo é o acréscimo de um estímulo após o comportamento, o que aumenta sua probabilidade. Retirar algo aversivo seria reforço negativo.'},
   {id:'m6-a1-q6',enunciado:'Qual é uma limitação dos modelos de condicionamento apontada na aula?',alts:['Eles explicam sozinhos toda a aprendizagem humana.','Não explicam, sozinhos, toda a aprendizagem humana, pois linguagem e processos cognitivos também participam.','Não têm base em pesquisa experimental.','Só valem para animais.'],correta:1,justificativa:'Os princípios são bem estabelecidos, mas não bastam para explicar toda a aprendizagem humana. Linguagem, observação e cognição também têm papel.'}
  ],
  cartoes:[
   {id:'m6-a1-c1',frente:'O que é aprendizagem, em sentido psicológico?',verso:'Mudança relativamente duradoura no comportamento, ou na probabilidade de um comportamento, resultante da experiência.'},
   {id:'m6-a1-c2',frente:'Quem está associado ao condicionamento clássico?',verso:'Ivan Pavlov.'},
   {id:'m6-a1-c3',frente:'Quem está associado ao condicionamento operante?',verso:'B. F. Skinner.'},
   {id:'m6-a1-c4',frente:'Qual a diferença entre reforço negativo e punição?',verso:'O reforço negativo aumenta o comportamento pela retirada de um estímulo aversivo. A punição diminui a probabilidade do comportamento.'},
   {id:'m6-a1-c5',frente:'Qual era o estímulo neutro no experimento de Pavlov?',verso:'O som do sino, que passou a provocar salivação após emparelhamento com a comida.'},
   {id:'m6-a1-c6',frente:'Quem estudou a aprendizagem observacional?',verso:'Albert Bandura, com a teoria da aprendizagem social.'}
  ]
 }
};
