const REF_CAP9=["[R01] Spielman, Jenkins e Lovett. Psychology 2e. OpenStax, 2020.","[R14] APA Dictionary: modelo dos cinco fatores (Five-factor personality model).","[R19] APA. Multicultural Guidelines, 2017."];
const AULAS_CAP9={
'm9-a1':{
 modulo:9, titulo:"Personalidade como padrão probabilístico", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.1",
 objetivos:["Definir personalidade como construto amplo e probabilístico","Distinguir modelo descritivo de modelo explicativo","Entender por que consistência não significa imutabilidade"],
 previos:"Conceitos de comportamento e de estímulo (ver Biblioteca).",
 previa:"Se alguém diz “sou uma pessoa tímida”, o que essa frase descreve e o que ela explica?",
 previaResposta:"Descreve um padrão observado ou relatado em situações. Não explica, sozinha, por que a pessoa age assim. Guarde essa distinção: ela aparece em toda a unidade.",
 secoes:[
  {t:"Personalidade é um padrão, não um destino", p:["Personalidade é um construto amplo usado para descrever padrões relativamente consistentes de pensamento, emoção e comportamento. “Relativamente” é a palavra-chave: os padrões se mantêm em boa parte das situações, mas variam conforme o contexto, a idade e a experiência.","Consistência não significa imutabilidade. Uma pessoa pode ter traços estáveis e, ainda assim, mudar ao longo da vida, por acontecimentos, relações ou educação."],
   pausa:{p:"Por que uma pessoa pode ser organizada no trabalho e desorganizada em casa sem contradição?", r:"Porque o padrão é probabilístico e depende do contexto: o mesmo traço se expressa de modos diferentes em ambientes diferentes."}},
  {t:"Descrever não é explicar", p:["A Psicologia distingue modelos descritivos de modelos explicativos. Um modelo descritivo organiza dimensões e mostra como as pessoas se distribuem nelas. Um modelo explicativo propõe mecanismos que produzem essas diferenças.","Dizer que alguém tem pontuação alta em uma dimensão não explica automaticamente de onde vem essa tendência nem o que ela vai produzir. Isso exige hipóteses testáveis sobre origem e consequências."],
   pausa:{p:"A frase “ele é extrovertido, por isso fala muito” é descritiva ou explicativa?", r:"A primeira parte é descritiva. A segunda tenta explicar, mas sem mecanismo testado: a característica vira causa de si mesma. É um argumento circular."}},
  {t:"Medidas, fontes e limites", p:["Pesquisas sobre personalidade usam autorrelato, observação e informantes (pessoas próximas que avaliam o participante). Cada fonte tem vieses: o autorrelato pode ser influenciado pela autoimagem, e a observação depende de quem observa e de onde.","Por isso, os resultados dependem da população e do instrumento. Um mesmo teste pode funcionar bem em um país e de forma diferente em outro."]}
 ],
 aprofundar:{t:"Para ir além", p:["Na próxima aula você verá o modelo dos cinco grandes fatores, o mais estudado entre os modelos descritivos de traços. Antes disso, vale ter clara a diferença entre descrever e explicar, porque ela aparece em quase todas as críticas ao uso de testes de personalidade."]},
 erros:["“Pontuação alta mostra a causa do comportamento.” Não: mostra um padrão medido, cuja origem precisa ser investigada.","“Traço estável significa destino fixo.” Não: estabilidade relativa convive com mudança média ao longo da vida."],
 resumo:["Personalidade é um construto que descreve padrões relativamente consistentes e probabilísticos.","Consistência não é imutabilidade.","Modelos descritivos organizam dimensões; modelos explicativos propõem mecanismos testáveis.","Autorrelato, observação e informantes têm limitações próprias."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a1-q1',enunciado:"Qual afirmação descreve melhor a personalidade segundo a aula?",alts:["Padrões relativamente consistentes de pensamento, emoção e comportamento, que variam com o contexto.", "Um conjunto fixo de características que não mudam.", "Um diagnóstico que classifica pessoas em tipos.", "Um reflexo direto da origem genética."],correta:0,justificativa:"A aula define personalidade como padrões relativamente consistentes e probabilísticos. Não é fixa, não é diagnóstico e não se reduz a uma causa única."},
  {id:'m9-a1-q2',enunciado:"Um pesquisador afirma: “a pontuação alta em neuroticismo causa a ansiedade”. Qual é o problema principal?",alts:["Não há problema: pontuação sempre explica causa.", "Confunde a descrição de uma dimensão com uma explicação causal que ainda precisa ser testada.", "O neuroticismo não existe.", "Só vale se o estudo usar observação."],correta:1,justificativa:"Uma pontuação descreve uma tendência medida. Afirmar causa exige hipótese e desenho adequados, e a relação pode ser apenas uma associação."}
 ],
 cartoes:[
  {id:'m9-a1-c1',frente:"O que é um construto probabilístico, como a personalidade?",verso:"Um padrão que aparece com maior ou menor chance em diferentes situações, e não uma regra fixa que determina o comportamento."},
  {id:'m9-a1-c2',frente:"Qual a diferença entre modelo descritivo e explicativo?",verso:"O descritivo organiza dimensões e mostra como as pessoas se distribuem nelas. O explicativo propõe mecanismos que produzem essas diferenças."}
 ]
},
'm9-a2':{
 modulo:9, titulo:"O modelo dos cinco grandes fatores (Big Five)", nivel:"Intermediário", tempo:25, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.2",
 objetivos:["Nomear as cinco dimensões do modelo","Entender que as dimensões são contínuas","Diferenciar o modelo descritivo da teoria explicativa"],
 previos:"Personalidade como padrão probabilístico.",
 previa:"Se você precisasse descrever uma pessoa em cinco dimensões amplas, quais escolheria?",
 previaResposta:"Não há resposta única. O objetivo é perceber que um modelo de dimensões amplas exige critérios claros. Compare sua lista com as cinco dimensões desta aula.",
 secoes:[
  {t:"As cinco dimensões", p:["O modelo dos Big Five descreve cinco dimensões amplas, frequentemente chamadas de abertura à experiência, conscienciosidade, extroversão, amabilidade e neuroticismo (ou instabilidade emocional).","A terminologia e a forma de medir variam entre instrumentos. Por isso, o nome de uma dimensão pode mudar um pouco conforme o autor ou o teste."],
   pausa:{p:"Reescreva cada dimensão com suas palavras, em uma frase.", r:"Exemplo: abertura à experiência = interesse por ideias e experiências variadas; neuroticismo = tendência a sentir emoções negativas com mais intensidade ou frequência. Confira se sua definição não soa como diagnóstico."}},
  {t:"Contínuo, não tipo", p:["As dimensões são contínuas: cada pessoa ocupa uma posição relativa em cada uma delas, e não pertence a um tipo rígido. Ser pouco extrovertido não é um rótulo nem um problema; descreve uma posição na distribuição."]},
  {t:"Descrição e teoria", p:["Há uma distinção importante. Como estrutura estatística, o Big Five descreve regularidades em dados de questionários. Em algumas interpretações, o Five-Factor Model propõe que essas dimensões refletem uma estrutura psicológica com pretensão explicativa. Tratar as duas coisas como sinônimos apaga diferenças importantes.","O modelo tem ampla investigação empírica, mas a interpretação das facetas e as comparações entre culturas exigem cuidado."]}
 ],
 aprofundar:{t:"Por que isso importa para você", p:["Ao ler um artigo que menciona “extroversão” ou “neuroticismo”, pergunte: a dimensão está sendo descrita ou explicada? Qual instrumento foi usado? A amostra era parecida com a sua?"]},
 erros:["“Big Five” é um teste que define o tipo de uma pessoa. Não: é um modelo de dimensões contínuas, e o uso de instrumentos exige critérios técnicos.","“Neuroticismo” é sinônimo de doença. Não: é uma dimensão contínua presente em todas as pessoas."],
 resumo:["O modelo Big Five descreve cinco dimensões: abertura, conscienciosidade, extroversão, amabilidade e neuroticismo.","As dimensões são contínuas e relativas.","Descrição estatística e interpretação explicativa são coisas diferentes.","Terminologia e medidas variam entre instrumentos."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a2-q1',enunciado:"Quais são as cinco dimensões do modelo dos grandes fatores?",alts:["Inteligência, memória, atenção, linguagem e percepção.", "Ansiedade, depressão, mania, fobia e psicose.", "Abertura à experiência, conscienciosidade, extroversão, amabilidade e neuroticismo.", "Introversão, passividade, timidez, sociabilidade e impulsividade."],correta:2,justificativa:"São as cinco dimensões amplas do modelo, descritas como contínuas. As demais alternativas misturam outros construtos ou rótulos clínicos."},
  {id:'m9-a2-q2',enunciado:"Por que as dimensões dos Big Five não devem ser lidas como tipos rígidos?",alts:["Porque só podem ser medidas em crianças.", "Porque não têm nenhuma relação com o comportamento.", "Porque são definidas por médicos.", "Porque são contínuas: cada pessoa ocupa uma posição relativa em cada dimensão."],correta:3,justificativa:"Posições relativas descrevem diferenças graduais. Tipos rígidos seriam categorias fechadas, o que não corresponde ao modelo."}
 ],
 cartoes:[
  {id:'m9-a2-c1',frente:"Quais são as cinco dimensões do Big Five?",verso:"Abertura à experiência, conscienciosidade, extroversão, amabilidade e neuroticismo (ou instabilidade emocional)."},
  {id:'m9-a2-c2',frente:"Big Five é um teste que define o tipo de personalidade?",verso:"Não. É um modelo de dimensões contínuas. A aplicação de instrumentos exige critérios técnicos e contexto profissional."}
 ]
},
'm9-a3':{
 modulo:9, titulo:"Perspectivas teóricas sobre a personalidade", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.3",
 objetivos:["Reconhecer as principais perspectivas além dos traços","Entender que cada perspectiva faz perguntas diferentes","Não confundir escalas de traços com teorias explicativas"],
 previos:"Modelo dos cinco grandes fatores.",
 previa:"Toda teoria de personalidade precisa usar escalas de traços?",
 previaResposta:"Não necessariamente. Teorias diferentes perguntam coisas diferentes: conflitos inconscientes, sentido de vida, aprendizagem, relações. Por isso, nem sempre dialogam com escalas de traços.",
 secoes:[
  {t:"Três grandes tradições", p:["As tradições psicodinâmicas investigam padrões de conflito, defesa e relações, com atenção a processos que nem sempre são conscientes. As abordagens humanistas enfatizam a construção de sentido, a autorrealização e a autonomia. Os modelos sociocognitivos estudam expectativas, aprendizagem, metas e a interação entre pessoa e ambiente.","Essas perspectivas não são necessariamente escalas de traços e não respondem à mesma pergunta. Comparar uma com a outra exige, antes, definir o que cada uma pretende explicar."],
   pausa:{p:"Que pergunta uma abordagem sociocognitiva faria sobre um estudante que procrastina?", r:"Ela perguntaria sobre expectativas de sucesso, valor atribuído à tarefa, metas e contexto: quais condições reduzem a procrastinação?"}},
  {t:"Perguntas diferentes, métodos diferentes", p:["A psicodinâmica costuma trabalhar com material clínico e narrativas; a sociocognitiva costuma usar experimentos e medidas comportamentais; a humanista costuma privilegiar a compreensão da experiência subjetiva. Cada escolha de método define que tipo de evidência é possível.","Uma comparação adequada começa por definir o objetivo: prever diferenças individuais, compreender narrativas pessoais ou investigar mudanças em condições específicas."]}
 ],
 aprofundar:{t:"Atenção ao rótulo", p:["Frases como “sou de tal signo, então sou assim” ou “tenho o traço X, então vou agir de Y” misturam perspectivas sem mecanismo e sem evidência. Estudar teorias é reconhecer em que nível cada uma se sustenta."]},
 erros:["“Todas as teorias medem traços.” Não: algumas estudam processos, sentidos ou relações que não se reduzem a escalas.","“Uma teoria é a verdade e as outras estão erradas.” Não: cada uma responde a perguntas diferentes e tem evidências de alcance diferente."],
 resumo:["Psicodinâmica, humanismo e sociocognitivismo fazem perguntas distintas sobre personalidade.","Escalas de traços são uma das formas de estudar o tema.","Comparar teorias exige definir antes o objetivo da comparação.","Métodos definem o tipo de evidência disponível."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a3-q1',enunciado:"Qual pergunta é mais típica de uma abordagem sociocognitiva?",alts:["Como expectativas, metas e aprendizagem influenciam o comportamento em contextos específicos?", "Quais conflitos inconscientes organizam o comportamento?", "Qual é o tipo rígido da pessoa?", "Qual é a origem biológica exclusiva do traço?"],correta:0,justificativa:"Abordagens sociocognitivas estudam expectativas, aprendizagem, metas e a interação pessoa-ambiente. As outras alternativas pertencem a outras tradições ou a leituras essencialistas."},
  {id:'m9-a3-q2',enunciado:"Por que escalas de traços não bastam para explicar todas as teorias de personalidade?",alts:["Porque escalas são sempre erradas.", "Porque algumas teorias investigam processos, sentidos ou relações que não se reduzem a pontuações em traços.", "Porque teorias só podem usar entrevistas.", "Porque traços não existem."],correta:1,justificativa:"Teorias diferentes têm objetos de estudo diferentes. Nem todas se organizam em torno de pontuações de traços."}
 ],
 cartoes:[
  {id:'m9-a3-c1',frente:"O que a perspectiva psicodinâmica investiga?",verso:"Padrões de conflito, defesa e relações, com atenção a processos que nem sempre são conscientes."},
  {id:'m9-a3-c2',frente:"O que a abordagem sociocognitiva estuda?",verso:"Expectativas, aprendizagem, metas e a interação entre pessoa e ambiente."}
 ]
},
'm9-a4':{
 modulo:9, titulo:"Psicometria: confiabilidade não é validade", nivel:"Intermediário", tempo:25, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.4",
 objetivos:["Definir confiabilidade e validade","Explicar por que consistência não garante validade","Reconhecer riscos de testes sem estudos de validação"],
 previos:"Noção de medida e de instrumento.",
 previa:"Um termômetro que marca sempre 5 graus a mais é confiável? E é válido?",
 previaResposta:"É consistente, portanto confiável no sentido de repetibilidade. Mas não é válido para medir temperatura, porque mede de forma sistemática algo diferente. Essa é a ideia central da aula.",
 secoes:[
  {t:"Confiabilidade", p:["Confiabilidade se relaciona à consistência das medidas sob condições especificadas. Se a mesma pessoa, nas mesmas condições, recebe resultados semelhantes, a medida é consistente."]},
  {t:"Validade", p:["Validade envolve evidências e teoria que sustentam as interpretações e os usos de uma pontuação. Um instrumento pode produzir resultados estáveis e, ainda assim, não medir adequadamente o construto que alega medir. Por isso, validade não é uma propriedade do teste em abstrato: ela se refere à interpretação e ao uso pretendidos."],
   pausa:{p:"Um teste de atenção dá resultados muito estáveis, mas mede sobretudo a velocidade de digitação. Ele é confiável? É válido para medir atenção?", r:"É confiável, porque é consistente. Não é válido para atenção, porque mede outro construto de forma estável."}},
  {t:"Normas e contexto", p:["Normas, erro de medida, viés, adaptação transcultural e finalidade são aspectos centrais. Uma escala validada em um grupo pode não funcionar da mesma forma em outro idioma ou contexto cultural."]},
  {t:"Testes populares na internet", p:["Muitos testes populares na internet usam linguagem científica sem apresentar estudos de validação. Usar termos como “psicométrico” não garante que o teste seja válido. No Brasil, a avaliação psicológica profissional e o uso de testes devem respeitar o sistema regulamentado e as condições de competência. Um app de estudos pode ensinar esses conceitos, mas não aplica nem interpreta testes restritos."]}
 ],
 alerta:"Conteúdo educacional. Esta aula não é um teste, não gera laudo e não substitui avaliação profissional.",
 erros:["“Se é consistente, é válido.” Não: consistência e validade são propriedades diferentes.","“Termo técnico prova qualidade.” Não: é preciso apresentar evidências."],
 resumo:["Confiabilidade é consistência das medidas sob condições especificadas.","Validade é a sustentação das interpretações e dos usos de uma pontuação.","Uma medida pode ser confiável e não válida.","Testes sem estudos de validação não devem ser usados como avaliação."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a4-q1',enunciado:"Uma medida é consistente em repetidas aplicações, mas não mede o que pretende. Qual conceito descreve bem a primeira característica?",alts:["Validade.", "Diagnóstico.", "Confiabilidade.", "Normalidade."],correta:2,justificativa:"Consistência é confiabilidade. A validade trata de a medida representar adequadamente o construto que pretende medir."},
  {id:'m9-a4-q2',enunciado:"Qual é a diferença central entre confiabilidade e validade?",alts:["São sinônimos perfeitos.", "Validade é a repetição de medidas e confiabilidade é a teoria.", "Só testes de inteligência têm validade.", "Confiabilidade é consistência; validade é a sustentação das interpretações e dos usos de uma pontuação."],correta:3,justificativa:"A distinção central é essa: consistência de um lado, evidência que sustenta a interpretação do outro."}
 ],
 cartoes:[
  {id:'m9-a4-c1',frente:"O que é confiabilidade?",verso:"Consistência das medidas sob condições especificadas."},
  {id:'m9-a4-c2',frente:"Confiabilidade garante validade?",verso:"Não. Uma medida pode ser consistente e medir de forma sistemática o construto errado."}
 ]
},
'm9-a5':{
 modulo:9, titulo:"Estabilidade, mudança e ética", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.5",
 objetivos:["Diferenciar estabilidade relativa de mudança média","Entender por que correlação não é determinismo","Reconhecer os riscos da rotulação"],
 previos:"Personalidade como padrão probabilístico.",
 previa:"Se uma pessoa ficou mais ansiosa após um ano difícil, isso significa que ela não tem traço estável?",
 previaResposta:"Não necessariamente. Pode haver estabilidade relativa (quem está acima ou abaixo dos outros tende a continuar assim) e mudança no nível individual ou médio. Ambas podem coexistir.",
 secoes:[
  {t:"Estabilidade relativa e mudança média", p:["Estudos longitudinais investigam a estabilidade relativa, isto é, quem está acima ou abaixo da média tende a permanecer nessa posição em relação aos outros, e também a mudança média de traços ao longo da vida. Essas duas afirmações não se contradizem."],
   pausa:{p:"Se todos os participantes ficaram, em média, um pouco mais conscienciosos com a idade, a ordem entre eles necessariamente mudou?", r:"Não necessariamente. A estabilidade relativa indica a posição dentro do grupo; a mudança média indica o nível geral. As duas podem ocorrer juntas."}},
  {t:"Correlação não é destino", p:["Uma correlação forte entre medidas não significa determinismo de uma biografia. Características individuais interagem com oportunidades, relações, educação e contextos de trabalho."]},
  {t:"Ética: não transformar medida em rótulo", p:["A pesquisa sobre personalidade exige prevenção de rotulação e discriminação. Um questionário não deve ser usado para definir quem “serve” para determinada profissão nem para justificar tratamento desigual sem base científica e ética sólida.","Para aprender, é melhor discutir medidas, modelos e interpretação de resultados do que criar testes recreativos com aparência de diagnóstico."]}
 ],
 erros:["“Se mudou, nunca foi traço.” Não: traços podem ser estáveis em posição relativa e mudar em média.","“Um teste de personalidade define quem a pessoa é.” Não: ele descreve padrões medidos em um contexto."],
 resumo:["Estabilidade relativa e mudança média coexistem.","Correlação não significa determinismo.","Medidas não devem virar rótulos nem critérios de exclusão sem base ética e técnica.","Aprender é discutir interpretação, não aplicar testes com aparência de diagnóstico."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a5-q1',enunciado:"Uma pessoa continua entre as mais extrovertidas do grupo após cinco anos. Qual conceito descreve isso?",alts:["Estabilidade relativa.", "Mudança média.", "Diagnóstico estável.", "Efeito de teto."],correta:0,justificativa:"Estabilidade relativa refere-se à posição de cada pessoa em relação às outras. Não exclui mudanças no nível médio do grupo."},
  {id:'m9-a5-q2',enunciado:"Qual uso de um questionário de personalidade é eticamente inadequado?",alts:["Explicar, em aula, o que a pontuação significa e quais são seus limites.", "Usar o resultado para excluir candidatos de uma vaga sem base técnica e legal.", "Discutir a validade do instrumento.", "Comparar modelos de traços em um trabalho."],correta:1,justificativa:"Usar medidas como critério de exclusão, sem base científica e ética, pode causar discriminação. As demais opções são usos educativos ou de análise crítica."}
 ],
 cartoes:[
  {id:'m9-a5-c1',frente:"O que é estabilidade relativa?",verso:"A posição de uma pessoa dentro do grupo tende a se manter ao longo do tempo, mesmo que o grupo como um todo mude em média."},
  {id:'m9-a5-c2',frente:"Por que um questionário não deve definir quem “serve” para uma profissão?",verso:"Porque a medida não tem essa finalidade validada e a decisão afeta direitos. Usá-la assim pode gerar discriminação."}
 ]
},
'm9-a6':{
 modulo:9, titulo:"O que significa medir um construto", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.6",
 objetivos:["Explicar por que traços são construtos e não observáveis diretos","Entender que itens são indicadores de um construto","Separar resultado, interpretação e decisão"],
 previos:"Confiabilidade e validade.",
 previa:"Você consegue observar diretamente a “curiosidade” de alguém?",
 previaResposta:"Não diretamente. Observam-se comportamentos e respostas (perguntas, exploração, escolhas). A curiosidade é um construto inferido a partir de indicadores.",
 secoes:[
  {t:"Construto e indicadores", p:["Traços de personalidade não são observados diretamente, como altura ou massa. Pesquisadores desenvolvem itens e tarefas que funcionam como indicadores de um construto teórico. A interpretação exige evidências sobre a estrutura do instrumento, sua consistência e sua relação com outras variáveis."],
   pausa:{p:"Uma escala longa é automaticamente melhor que uma curta?", r:"Não. Tamanho não garante qualidade. Importam a clareza dos itens, a evidência de validade e a finalidade do uso."}},
  {t:"Contexto e comparação", p:["Respostas podem variar com o contexto, com a compreensão das perguntas e com normas culturais. Comparações entre grupos exigem equivalência de medida: a mesma pontuação precisa representar o mesmo significado nos dois grupos. Caso contrário, diferenças numéricas podem refletir apenas o funcionamento distinto do instrumento."]},
  {t:"Resultado, interpretação e decisão", p:["O estudante deve diferenciar três coisas: o resultado de um teste, a interpretação desse resultado e as decisões que alguém pretende tomar a partir dele. Cada etapa precisa de justificativa própria."]}
 ],
 erros:["“A pontuação mostra exatamente quem a pessoa é.” Não: mostra um indicador do construto, em um contexto e com erro de medida.","“Escala conhecida serve para qualquer finalidade.” Não: cada uso precisa de evidência própria."],
 resumo:["Construtos são inferidos a partir de indicadores.","Escalas precisam de evidências de estrutura, consistência e relação com outras variáveis.","Comparar grupos exige equivalência de medida.","Resultado, interpretação e decisão são etapas diferentes."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a6-q1',enunciado:"Por que traços são chamados de construtos?",alts:["Porque são observados diretamente, como a altura.", "Porque são definidos por lei.", "Porque são conceitos teóricos inferidos a partir de indicadores observáveis.", "Porque não se relacionam com o comportamento."],correta:2,justificativa:"Construtos são conceitos teóricos. Não são observados diretamente; são inferidos a partir de itens, tarefas e comportamentos."},
  {id:'m9-a6-q2',enunciado:"Duas turmas de países diferentes obtêm médias distintas em uma escala. O que precisa ser verificado antes de concluir que há diferença real entre elas?",alts:["Nada: a diferença numérica basta.", "Se os participantes gostaram do teste.", "Se a escala é longa.", "Se há equivalência de medida, ou seja, se a mesma pontuação significa o mesmo nos dois grupos."],correta:3,justificativa:"Sem equivalência de medida, a diferença numérica pode refletir o funcionamento distinto do instrumento, e não diferenças reais entre os grupos."}
 ],
 cartoes:[
  {id:'m9-a6-c1',frente:"O que é um construto?",verso:"Conceito teórico que não é observado diretamente e é inferido a partir de indicadores, como itens e tarefas."},
  {id:'m9-a6-c2',frente:"O que é equivalência de medida?",verso:"Condição em que a mesma pontuação representa o mesmo significado em grupos diferentes, o que permite comparações."}
 ]
},
'm9-a7':{
 modulo:9, titulo:"Taxonomia descritiva e teoria causal", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.7",
 objetivos:["Diferenciar classificar traços de explicar por que eles surgem","Reconhecer argumentos circulares","Entender o papel do aplicativo frente aos questionários pessoais"],
 previos:"Modelo dos cinco grandes fatores; perspectivas teóricas.",
 previa:"“Ela participa muito porque é extrovertida” explica alguma coisa?",
 previaResposta:"Quase nada, se a única base for a própria descrição repetida. Falta um mecanismo testável, como aprendizagem, disposição biológica ou interação com o ambiente.",
 secoes:[
  {t:"Descrever regularidades", p:["A classificação de traços facilita o resumo de regularidades, mas não responde automaticamente à pergunta sobre por que elas surgem."]},
  {t:"Mecanismos", p:["Teorias explicativas propõem mecanismos: processos de aprendizagem, disposições biológicas ou interação pessoa-ambiente. Misturar essas funções gera argumentos circulares, como dizer que alguém participa muito “porque é extrovertido”, sem adicionar um mecanismo testável."],
   pausa:{p:"Reescreva “ele estuda muito porque é disciplinado” como uma explicação com mecanismo testável.", r:"Exemplo: “ele mantém a rotina de estudo porque recebe reforço ao concluir tarefas; isso pode ser testado comparando rotinas com e sem feedback”. A resposta exige hipótese verificável, e não apenas outro rótulo."}},
  {t:"Uso acadêmico", p:["Os cinco grandes fatores costumam ser estudados em termos probabilísticos. A taxonomia deve ser entendida como ferramenta para pesquisas, não como certificado definitivo de identidade. No âmbito acadêmico, é válido examinar correlações de traços com resultados, considerando tamanho de efeito, contexto e erros de medida.","Um aplicativo de estudos não precisa aplicar questionários pessoais para ensinar o modelo."]}
 ],
 erros:["“Descrever é explicar.” Não: descrever mostra padrões; explicar exige mecanismos testados.","“Um traço prova por que a pessoa age assim.” Não sem evidência do mecanismo."],
 resumo:["Taxonomias organizam regularidades, mas não explicam por si.","Teorias causais propõem mecanismos testáveis.","Argumentos circulares repetem a descrição como se fosse explicação.","Ensinar o modelo não exige aplicar questionários."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a7-q1',enunciado:"Qual frase é um argumento circular?",alts:["“Ele procrastina porque é procrastinador.”", "“Pessoas com alta conscienciosidade tendem a planejar mais tarefas.”", "“A aprendizagem por reforço pode explicar a rotina de estudo.”", "“Os resultados mudam em amostras diferentes.”"],correta:0,justificativa:"A explicação repete o próprio fenômeno como causa, sem mecanismo. As demais frases são descrições ou hipóteses testáveis."},
  {id:'m9-a7-q2',enunciado:"Qual é a melhor função de uma taxonomia de traços?",alts:["Certificar a identidade definitiva de uma pessoa.", "Organizar dimensões para pesquisa e comparação, reconhecendo seus limites explicativos.", "Substituir teorias causais.", "Decidir quem tem diagnóstico."],correta:1,justificativa:"Taxonomias organizam dimensões. Não certificam identidade, não substituem teorias causais e não diagnosticam."}
 ],
 cartoes:[
  {id:'m9-a7-c1',frente:"Por que “porque é extrovertido” costuma ser um argumento circular?",verso:"Porque repete a descrição como se fosse a causa, sem mecanismo testável."},
  {id:'m9-a7-c2',frente:"O que uma teoria causal acrescenta a uma descrição?",verso:"Um mecanismo proposto (aprendizagem, disposição biológica, interação pessoa-ambiente) que pode ser testado."}
 ]
},
'm9-a8':{
 modulo:9, titulo:"Mudança e estabilidade ao longo da vida", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.8",
 objetivos:["Interpretar estudos longitudinais","Diferenciar associação de causalidade em eventos de vida","Usar uma linguagem que não transforma probabilidade em rótulo"],
 previos:"Estabilidade, mudança e ética.",
 previa:"Se um emprego novo está associado a mudanças de personalidade, o emprego causou essas mudanças?",
 previaResposta:"Não necessariamente. Pessoas com certas características podem escolher ou alcançar determinados empregos. A associação precisa de análise cuidadosa antes que se fale em causa.",
 secoes:[
  {t:"Duas afirmações compatíveis", p:["Um traço pode apresentar estabilidade relativa, ou seja, diferenças entre pessoas persistem em certo grau, e ao mesmo tempo mudança média de níveis ao longo do tempo. Essas duas afirmações não se contradizem. Para compreendê-las, é necessário observar o tipo de análise e a população estudada."]},
  {t:"Eventos de vida e causalidade", p:["Mudanças associadas a eventos de vida não provam causalidade, pois experiências e características anteriores podem influenciar quais situações uma pessoa encontra. Estudos longitudinais enfrentam perdas de participantes e alterações de instrumentos. A formação científica exige avaliar essas limitações antes de concluir que uma ocupação ou um relacionamento “transforma a personalidade”."],
   pausa:{p:"Por que a perda de participantes em estudos longitudinais importa?", r:"Quem sai do estudo pode ser diferente de quem fica (mais ou menos motivado, por exemplo), o que pode enviesar as médias. É preciso analisar quem saiu e discutir o efeito."}},
  {t:"Linguagem respeitosa", p:["A linguagem deve respeitar as pessoas e evitar transformar resultados probabilísticos em rótulos imutáveis."]}
 ],
 erros:["“Este evento mudou a personalidade dele.” Sem desenho adequado, o máximo é uma associação.","“Estabilidade significa que nada muda.” Não: indica posição relativa."],
 resumo:["Estabilidade relativa e mudança média coexistem.","Eventos de vida associados a mudanças não provam causa sem análise adequada.","Estudos longitudinais têm perdas e alterações que precisam ser avaliadas.","Probabilidade não deve virar rótulo."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a8-q1',enunciado:"Um estudo longitudinal mostra mudança média de um traço e estabilidade relativa das posições. Essas duas afirmações são:",alts:["Contraditórias.", "Prova de erro no instrumento.", "Compatíveis, pois descrevem aspectos diferentes do mesmo padrão.", "Válidas apenas para crianças."],correta:2,justificativa:"Estabilidade relativa descreve a posição entre pessoas; mudança média descreve o nível do grupo ao longo do tempo. As duas podem ocorrer juntas."},
  {id:'m9-a8-q2',enunciado:"Por que a perda de participantes pode distorcer um estudo longitudinal?",alts:["Porque aumenta a quantidade de dados.", "Porque torna os questionários mais caros.", "Porque elimina a estabilidade relativa.", "Porque quem sai pode diferir sistematicamente de quem permanece, enviesando os resultados."],correta:3,justificativa:"Perdas não aleatórias produzem amostras diferentes da inicial, o que pode distorcer as estimativas de mudança."}
 ],
 cartoes:[
  {id:'m9-a8-c1',frente:"Estabilidade relativa e mudança média são contraditórias?",verso:"Não. Descrevem aspectos diferentes: a posição relativa entre pessoas e o nível médio do grupo ao longo do tempo."},
  {id:'m9-a8-c2',frente:"Por que a associação entre evento de vida e mudança não prova causa?",verso:"Porque características anteriores podem influenciar quais situações a pessoa encontra e como ela responde a elas."}
 ]
},
'm9-a9':{
 modulo:9, titulo:"Questões éticas na avaliação de diferenças", nivel:"Intermediário", tempo:20, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9.9",
 objetivos:["Identificar contextos em que medidas afetam direitos","Reconhecer a necessidade de consultar normas profissionais","Aplicar a pergunta sobre decisão e evidência"],
 previos:"Confiabilidade e validade; estabilidade e ética.",
 previa:"Uma escala de personalidade pode ser usada para selecionar pessoas em uma empresa? O que precisaria existir antes?",
 previaResposta:"Evidência de validade para essa finalidade, normas adequadas, consentimento e revisão ética e legal. Sem isso, a decisão tem base frágil.",
 secoes:[
  {t:"Onde as medidas afetam vidas", p:["Mensurações psicológicas podem apoiar pesquisas, mas também produzir danos quando são usadas fora do seu contexto de validação. Seleção, educação, saúde e justiça são ambientes em que decisões afetam direitos e oportunidades. Um instrumento inadequado pode intensificar desigualdades; por isso, qualidade técnica e legislação não são detalhes burocráticos."]},
  {t:"Normas e materiais educativos", p:["O SATEPSI e as normas profissionais sobre avaliação psicológica precisam ser consultados para usos profissionais. Materiais educativos podem explicar conceitos psicométricos sem revelar itens protegidos, aplicar instrumentos privativos ou interpretar perfis clínicos. Um quiz recreativo deve ser claramente identificado como atividade de aprendizagem, nunca como diagnóstico disfarçado."],
   pausa:{p:"Um quiz diz “descubra se você é um líder nato” e entrega um resultado definitivo. O que está errado?", r:"Afirma uma identidade definitiva sem evidência de validade para essa finalidade e se apresenta como avaliação. Um material educativo deve deixar claro que é atividade de aprendizagem."}},
  {t:"Perguntas antes de decidir", p:["Ao ler resultados, pergunte que decisão se pretende tomar, que evidências sustentam tal uso e quais consequências um erro de classificação poderia causar."]}
 ],
 erros:["“Se é científico, pode ser usado para qualquer decisão.” Não: a validade depende da finalidade.","“Quiz recreativo é inofensivo.” Ele pode rotular e causar dano quando apresentado como avaliação."],
 resumo:["Medidas afetam direitos quando usadas em seleção, educação, saúde ou justiça.","A validade depende da finalidade do uso.","Normas profissionais devem ser consultadas.","Um quiz educativo deve ser identificado como atividade de aprendizagem."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a9-q1',enunciado:"Qual pergunta deve ser feita antes de usar um resultado para decidir algo sobre uma pessoa?",alts:["Que decisão se pretende tomar e que evidências sustentam esse uso?", "Qual é a cor preferida do avaliador?", "O teste é popular na internet?", "Quantas pessoas já fizeram o teste?"],correta:0,justificativa:"A decisão e a evidência que a sustenta são o ponto central. Popularidade e número de usuários não validam a finalidade."},
  {id:'m9-a9-q2',enunciado:"Por que um quiz recreativo não deve parecer diagnóstico?",alts:["Porque diagnósticos são proibidos em qualquer contexto.", "Porque pode rotular a pessoa com base em evidência inexistente para essa finalidade.", "Porque quizzes são sempre longos.", "Porque não há questões de personalidade."],correta:1,justificativa:"Apresentar um quiz como diagnóstico rotula pessoas sem evidência para essa finalidade, o que pode causar dano."}
 ],
 cartoes:[
  {id:'m9-a9-c1',frente:"Qual é a pergunta central antes de usar um resultado para decidir?",verso:"Que decisão se pretende tomar, que evidências sustentam esse uso e quais consequências teria um erro de classificação."},
  {id:'m9-a9-c2',frente:"O que um material educativo deve deixar claro?",verso:"Que é atividade de aprendizagem, e não avaliação nem diagnóstico."}
 ]
},
'm9-a10':{
 modulo:9, titulo:"Laboratório do capítulo 9: interpretando um resultado", nivel:"Intermediário", tempo:25, disciplina:"Personalidade e diferenças individuais", fonte:"Caderno de Pesquisa, capítulo 9 (laboratório e verificação)", tipo:"laboratorio",
 objetivos:["Aplicar os conceitos do capítulo a um caso hipotético","Identificar afirmações absolutas, rótulos e confusões com diagnóstico","Discutir o que torna uma interpretação válida"],
 previos:"Todas as aulas do capítulo 9.",
 previa:"Uma pontuação alta em um teste basta para afirmar algo sobre a pessoa?",
 previaResposta:"Não. Uma pontuação precisa de evidência de validade para a finalidade, norma adequada, contexto e uma decisão justificada.",
 secoes:[{t:"Como usar este laboratório", p:["Leia o caso, responda às perguntas antes de abrir as orientações e só então compare. O objetivo é treinar a leitura crítica, não encontrar uma “resposta certa” para uma pessoa real."]}],
 caso:"Um quiz chama o usuário de “líder nato, incapaz de sentir ansiedade”. O resultado aparece como definitivo, sem explicar como foi construído nem para que serve.",
 casoPerguntas:["Quais afirmações são absolutas?","Que rótulos aparecem?","Há evidência psicométrica informada?","Há confusão com diagnóstico?"],
 critica:"Que informações seriam necessárias para considerar válida a interpretação de uma pontuação psicológica?",
 criticaResposta:"Evidências de validade para a finalidade, normas adequadas à população, descrição do instrumento, condições de aplicação, margem de erro e a decisão que se pretende tomar.",
 erros:["Confundir resultado de quiz com diagnóstico.","Tratar traço como tipo fixo."],
 resumo:["Interpretar uma pontuação exige evidência, contexto e finalidade.","Afirmações absolutas e rótulos são sinais de alerta.","Traços são tendências graduais.","Confiabilidade não basta: é preciso validade."],
 referencias:REF_CAP9,
 questoes:[
  {id:'m9-a10-q1',enunciado:"Por que traços não são tipos rígidos?",alts:["Porque são pouco importantes.", "Porque só existem em adultos.", "Porque representam tendências graduais cuja expressão varia por situação.", "Porque são definidos por médicos."],correta:2,justificativa:"Traços descrevem tendências graduais, que se expressam de modo variado conforme o contexto. Por isso não funcionam como categorias fechadas."},
  {id:'m9-a10-q2',enunciado:"Nomeie as cinco dimensões dos Big Five.",alts:["Memória, atenção, linguagem, percepção e emoção.", "Ansiedade, depressão, mania, fobia e psicose.", "Ler, escrever, contar, pensar e agir.", "Abertura, conscienciosidade, extroversão, amabilidade e neuroticismo."],correta:3,justificativa:"São as cinco dimensões amplas do modelo. As demais listas misturam outros construtos ou rótulos clínicos."},
  {id:'m9-a10-q3',enunciado:"Qual é a diferença entre confiabilidade e validade?",alts:["Confiabilidade é consistência das medidas; validade é a sustentação das interpretações e dos usos.", "São sinônimos.", "Validade depende apenas do tamanho da escala.", "Confiabilidade prova o diagnóstico."],correta:0,justificativa:"Consistência não basta: a medida precisa ser sustentada por evidências para a interpretação pretendida."},
  {id:'m9-a10-q4',enunciado:"Um teste online pode ser tomado como avaliação clínica?",alts:["Sim, se for popular.", "Não; sem estudos de validação e condições profissionais, não substitui avaliação.", "Sim, se tiver muitas perguntas.", "Sim, se o resultado for positivo."],correta:1,justificativa:"Avaliação clínica exige processo profissional, instrumentos validados para a finalidade e condições de uso apropriadas."},
  {id:'m9-a10-q5',enunciado:"Por que o contexto importa em estudos de personalidade?",alts:["Porque o contexto nunca importa.", "Porque a personalidade é igual em todos os lugares.", "Porque respostas e resultados dependem de população, instrumento e situação.", "Porque evita qualquer pesquisa."],correta:2,justificativa:"Resultados dependem de população, instrumento e contexto. Generalizações sem cuidado podem ser indevidas."}
 ],
 cartoes:[
  {id:'m9-a10-c1',frente:"O que torna uma interpretação de pontuação válida?",verso:"Evidência de validade para a finalidade, norma adequada, contexto, margem de erro e decisão justificada."},
  {id:'m9-a10-c2',frente:"Por que um teste online não substitui avaliação?",verso:"Porque raramente tem estudos de validação, normas e condições de aplicação exigidas em avaliação profissional."}
 ]
}
};

const REF_CAP10=["[R01] Spielman, Jenkins e Lovett. Psychology 2e. OpenStax, 2020.","[R07] CNS. Resolução nº 510, de 2016.","[R08] CNS. Resolução nº 466, de 2012.","[R09] Open Science Collaboration. Science, 349, aac4716, 2015.","[R10] Dunlosky et al. Psychological Science in the Public Interest, 2013.","[R11] Roediger e Karpicke. Psychological Science, 2006."];
const AULAS_CAP10={
'm10-a1':{
 modulo:10, titulo:"Da pergunta à hipótese testável", nivel:"Iniciante", tempo:20, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.1",
 objetivos:["Transformar uma pergunta vaga em hipótese testável","Identificar o que precisa ser definido antes de testar","Distinguir construto, indicador e interpretação"],
 previos:"Noções de variável e de medida.",
 previa:"Se a pergunta é “flashcards melhoram a retenção?”, o que exatamente precisa ser definido?",
 previaResposta:"Conteúdo, participantes, comparação, momento em que a memória é avaliada e o que conta como desfecho.",
 secoes:[
  {t:"Do problema à hipótese", p:["Uma investigação começa com um problema delimitado, revisão de literatura e definições operacionais claras. Uma hipótese deve explicitar relações possíveis que possam ser confrontadas com observações.","Para perguntar se flashcards melhoram a retenção, é preciso determinar o conteúdo, quem participa, qual comparação será feita, quando a memória será avaliada e como se definirá o desfecho."],
   pausa:{p:"A hipótese “estudar com flashcards melhora a nota” está bem formulada?", r:"Ainda não. Falta a comparação (com o quê?), o momento da avaliação e a definição de nota ou desempenho. Uma hipótese testável especifica essas condições."}},
  {t:"Construto, indicador e interpretação", p:["Conceitos são operacionalizados por instrumentos e procedimentos. Uma escala de motivação não captura automaticamente toda a experiência de motivação, e o desempenho em prova não é sinônimo perfeito de aprendizagem. Pesquisadores precisam distinguir construto, indicador, desenho e interpretação."]}
 ],
 erros:["“Desempenho em prova é aprendizagem.” Não: é um indicador, que pode ser imperfeito.","“Uma hipótese pode ser qualquer frase bonita.” Não: precisa ser confrontável com observações."],
 resumo:["Uma hipótese testável especifica as relações e as condições de comparação.","Conceitos são operacionalizados por indicadores e procedimentos.","Desempenho em prova é um indicador, não a própria aprendizagem.","Construto, indicador, desenho e interpretação são etapas distintas."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a1-q1',enunciado:"Para que serve operacionalizar um conceito?",alts:["Para torná-lo mais bonito no texto.", "Para dispensar a coleta de dados.", "Para transformar o conceito em opinião.", "Para definir indicadores e procedimentos que permitem observá-lo e investigá-lo."],correta:3,justificativa:"Operacionalizar é definir como o conceito será observado: que indicadores e que procedimentos serão usados."},
  {id:'m10-a1-q2',enunciado:"Desempenho em prova equivale automaticamente a aprendizagem?",alts:["Não necessariamente; é um indicador imperfeito de aprendizagem.", "Sim, sempre.", "Sim, se a prova for difícil.", "Sim, se o aluno estudou."],correta:0,justificativa:"Uma prova mede um desempenho em uma situação específica. Ela pode não captar toda a aprendizagem nem a retenção em prazo mais longo."}
 ],
 cartoes:[
  {id:'m10-a1-c1',frente:"O que é uma hipótese testável?",verso:"Uma afirmação que especifica uma relação entre variáveis e pode ser confrontada com observações."},
  {id:'m10-a1-c2',frente:"Qual a diferença entre construto e indicador?",verso:"O construto é o conceito teórico (como motivação). O indicador é o que se observa para representá-lo (como uma resposta em escala)."}
 ]
},
'm10-a2':{
 modulo:10, titulo:"Desenhos de pesquisa: observação, experimento e métodos mistos", nivel:"Iniciante", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.2",
 objetivos:["Diferenciar estudos correlacionais de experimentos","Reconhecer o que cada desenho permite concluir","Entender o papel de métodos qualitativos e mistos"],
 previos:"Da pergunta à hipótese testável.",
 previa:"Se você quer saber se um recurso causa melhora, o que um estudo observacional consegue afirmar?",
 previaResposta:"Associações. Não estabelece causalidade de forma automática.",
 secoes:[
  {t:"Correlacional e experimental", p:["Estudos correlacionais examinam associações, mas não estabelecem causalidade de forma automática. Experimentos manipulam condições com procedimentos de controle e, quando apropriado, alocação aleatória. Sua validade depende da implementação e da mensuração."],
   pausa:{p:"Um experimento sem alocação aleatória pode ser útil?", r:"Pode, em muitos casos, mas exige cuidado: os grupos podem diferir em vários aspectos, o que limita a inferência causal."}},
  {t:"Qualitativo e métodos mistos", p:["Estudos qualitativos exploram sentidos, práticas e processos em profundidade, com critérios próprios de rigor, como transparência analítica e reflexividade.","Escolher um método é escolher o tipo de pergunta que se pode responder. Entrevistas não são “menos científicas” por não terem experimentos. Métodos mistos podem integrar resultados, desde que a lógica de combinação seja explícita."]}
 ],
 erros:["“Entrevista não é ciência.” Não: responde a outro tipo de pergunta, com critérios de rigor próprios.","“Experimento sempre prova causa.” Depende da implementação, da mensuração e da alocação."],
 resumo:["Correlação não estabelece causalidade automaticamente.","Experimentos com controle e alocação aleatória apoiam inferências causais.","Métodos qualitativos têm critérios próprios de rigor.","Métodos mistos exigem lógica de integração explícita."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a2-q1',enunciado:"Qual desenho permite inferir causalidade com mais força?",alts:["Estudo correlacional transversal.", "Experimento com manipulação e controle adequados.", "Entrevista exploratória.", "Revisão de opiniões."],correta:1,justificativa:"A manipulação de condições com controle é o que mais apoia a inferência causal, desde que bem implementada."},
  {id:'m10-a2-q2',enunciado:"Por que entrevistas não são “menos científicas” por si só?",alts:["Porque não geram dados.", "Porque sempre usam estatística.", "Porque respondem a outro tipo de pergunta, com critérios de rigor próprios.", "Porque são proibidas."],correta:2,justificativa:"Cada método responde a um tipo de pergunta. O rigor qualitativo se avalia por critérios próprios."}
 ],
 cartoes:[
  {id:'m10-a2-c1',frente:"O que um estudo correlacional não estabelece automaticamente?",verso:"Causalidade."},
  {id:'m10-a2-c2',frente:"Quais critérios de rigor valem para pesquisas qualitativas?",verso:"Coerência entre problema e método, transparência analítica, reflexividade e material que sustente as interpretações."}
 ]
},
'm10-a3':{
 modulo:10, titulo:"Amostragem, medidas e vieses", nivel:"Iniciante", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.3",
 objetivos:["Explicar como a amostra limita inferências","Diferenciar viés de seleção de confundimento","Reconhecer que significância estatística não é relevância prática"],
 previos:"Desenhos de pesquisa.",
 previa:"Uma amostra de voluntários de uma única escola representa bem todos os estudantes do país?",
 previaResposta:"Em geral, não. Pode ser útil para certas perguntas, mas limita as inferências sobre populações diferentes.",
 secoes:[
  {t:"Amostra e viés de seleção", p:["Uma amostra de conveniência pode ser útil, mas limita inferências sobre populações diferentes. Critérios de inclusão, tamanho amostral, perdas, poder estatístico e condições de coleta influenciam as conclusões.","Viés de seleção ocorre quando diferenças entre grupos se relacionam ao processo de participação. Confundimento surge quando outra variável está associada à exposição e ao resultado."],
   pausa:{p:"Qual a diferença entre viés de seleção e confundimento?", r:"O viés de seleção vem de como as pessoas entraram ou permaneceram no estudo. O confundimento vem de uma variável associada à exposição e ao resultado, que pode explicar a relação observada."}},
  {t:"Medidas e significância", p:["Pesquisadores devem observar confiabilidade, validade, efeitos de teto e piso, dados ausentes e adequação cultural dos instrumentos. Um resultado “estatisticamente significativo” não informa, sozinho, relevância prática ou robustez."]}
 ],
 erros:["“Amostra grande elimina qualquer viés.” Não: tamanho não corrige seleção enviesada.","“Significativo quer dizer importante.” Não necessariamente: é preciso avaliar magnitude e contexto."],
 resumo:["A amostra define o alcance das inferências.","Viés de seleção vem do processo de participação.","Confundimento é uma variável associada à exposição e ao resultado.","Significância estatística não garante relevância prática."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a3-q1',enunciado:"O que é viés de seleção?",alts:["Erro aleatório de medida.", "Uso de estatística avançada.", "Falta de hipótese.", "Diferença sistemática causada pelo processo de participação."],correta:3,justificativa:"O viés de seleção é sistemático: decorre de quem participa ou permanece no estudo, e não do acaso."},
  {id:'m10-a3-q2',enunciado:"Um resultado estatisticamente significativo garante relevância prática?",alts:["Não; a significância estatística não informa sozinha relevância prática ou robustez.", "Sim, sempre.", "Sim, se a amostra for grande.", "Só em experimentos."],correta:0,justificativa:"Significância indica compatibilidade com um modelo estatístico. Relevância depende de magnitude, custos, benefícios e contexto."}
 ],
 cartoes:[
  {id:'m10-a3-c1',frente:"O que é viés de seleção?",verso:"Diferença sistemática entre grupos causada pelo processo de participação ou permanência no estudo."},
  {id:'m10-a3-c2',frente:"Significância estatística garante relevância prática?",verso:"Não. É preciso avaliar magnitude, contexto, custos e benefícios."}
 ]
},
'm10-a4':{
 modulo:10, titulo:"Correlação, causalidade e interpretação estatística", nivel:"Iniciante", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.4",
 objetivos:["Explicar por que correlação não prova causa","Interpretar o valor de p com cuidado","Reconhecer gráficos que exageram diferenças"],
 previos:"Amostragem, medidas e vieses.",
 previa:"Alunos que dormem mais tiram notas melhores. Isso prova que dormir melhora as notas?",
 previaResposta:"Não. A associação pode envolver outras variáveis, causalidade reversa ou fatores comuns.",
 secoes:[
  {t:"Associação e causa", p:["Uma correlação positiva entre horas de sono e notas não demonstra que aumentar o sono produzirá a mesma melhora em qualquer contexto. As relações podem envolver variáveis adicionais, causalidade reversa e fatores comuns. A inferência causal depende de desenho, pressupostos e análise."],
   pausa:{p:"Cite uma variável que poderia explicar tanto o sono quanto as notas.", r:"Por exemplo, rotina de estudo, condições socioeconômicas, saúde ou carga de atividades. Qualquer variável associada aos dois pode criar a relação observada."}},
  {t:"Valor de p, tamanho de efeito e gráficos", p:["Valores de p não representam diretamente a probabilidade de uma hipótese ser verdadeira. Intervalos de confiança e tamanhos de efeito acrescentam informação importante.","Gráficos podem induzir interpretações exageradas quando os eixos são truncados ou a variabilidade é escondida. Não confunda porcentagem de acertos com desempenho permanente sem avaliar a retenção em prazo adequado."]}
 ],
 erros:["“p menor que 0,05 prova a hipótese.” Não: o valor de p não é a probabilidade de a hipótese ser verdadeira.","“Correlação alta significa causa.” Não sem desenho e análise adequados."],
 resumo:["Correlação não prova causalidade.","Variáveis adicionais podem explicar a associação.","Valor de p não é probabilidade da hipótese.","Gráficos com eixos truncados podem exagerar diferenças."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a4-q1',enunciado:"Um valor de p baixo indica que a hipótese é verdadeira?",alts:["Sim, indica a probabilidade de a hipótese ser verdadeira.", "Não; indica a compatibilidade dos dados com um modelo estatístico e seus pressupostos.", "Sim, sempre.", "Indica o tamanho do efeito."],correta:1,justificativa:"O valor de p é uma informação relativa ao modelo estatístico e aos seus pressupostos, não a probabilidade de a hipótese ser verdadeira."},
  {id:'m10-a4-q2',enunciado:"Por que gráficos com eixos truncados podem enganar?",alts:["Porque deixam o gráfico colorido.", "Porque mostram todos os dados.", "Porque exageram visualmente diferenças que os dados não sustentam.", "Porque são obrigatórios."],correta:2,justificativa:"Eixos truncados alteram a percepção visual da magnitude. Por isso, é preciso comparar médias, distribuições e incertezas."}
 ],
 cartoes:[
  {id:'m10-a4-c1',frente:"Correlação prova causalidade?",verso:"Não. Pode haver variáveis adicionais, causalidade reversa ou fatores comuns."},
  {id:'m10-a4-c2',frente:"O que um valor de p não representa diretamente?",verso:"A probabilidade de a hipótese científica ser verdadeira."}
 ]
},
'm10-a5':{
 modulo:10, titulo:"Reprodutibilidade, transparência e ciência aberta", nivel:"Iniciante", tempo:20, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.5",
 objetivos:["Explicar o debate sobre replicação","Reconhecer práticas de transparência","Entender por que um estudo isolado não basta"],
 previos:"Correlação, causalidade e interpretação estatística.",
 previa:"Um estudo pequeno com resultado surpreendente deve virar regra para a educação?",
 previaResposta:"Não. Um estudo isolado, sobretudo pequeno, não deve se converter imediatamente em regra. Um conjunto convergente de estudos costuma oferecer base mais sólida.",
 secoes:[
  {t:"O debate sobre replicação", p:["O debate contemporâneo sobre replicação mostrou dificuldades de reprodução de determinados resultados em Psicologia e estimulou práticas de transparência. Registro prévio de hipóteses, disponibilização responsável de materiais e dados, relatórios completos e revisões sistemáticas ajudam a reduzir vieses de publicação e escolhas analíticas oportunistas. Nenhuma dessas práticas elimina completamente as incertezas."],
   pausa:{p:"O que é registro prévio de hipóteses e por que ajuda?", r:"É registrar, antes da coleta, o que será testado e como. Isso reduz a chance de escolher análises depois de ver os resultados."}},
  {t:"Convergência e correções", p:["Um conjunto convergente de estudos, com métodos adequados e contextos diversos, costuma oferecer base mais sólida. Resultados negativos e correções também fazem parte do progresso científico."]}
 ],
 erros:["“Um estudo isolado é uma regra universal.” Não: resultados dependem de amostra, métodos e contexto.","“Resultado negativo é fracasso da ciência.” Não: ele também informa e faz parte do progresso."],
 resumo:["A replicação é parte central da confiança científica.","Registro prévio e transparência reduzem vieses.","Um estudo isolado não deve virar regra universal.","Resultados negativos e correções fazem parte do progresso."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a5-q1',enunciado:"Qual prática ajuda a reduzir vieses de publicação?",alts:["Publicar apenas resultados positivos.", "Não divulgar os métodos.", "Usar amostras menores.", "Registro prévio de hipóteses e relatórios completos."],correta:3,justificativa:"Registro prévio e relatórios completos reduzem a seleção de resultados e as escolhas analíticas oportunistas."},
  {id:'m10-a5-q2',enunciado:"Por que um estudo isolado não deve virar regra universal?",alts:["Porque um resultado depende de amostra, métodos e contexto, e precisa de convergência.", "Porque estudos isolados nunca têm resultados.", "Porque regras universais são proibidas.", "Porque a ciência não usa regras."],correta:0,justificativa:"Sustentação científica vem de um conjunto convergente de estudos, não de um único achado."}
 ],
 cartoes:[
  {id:'m10-a5-c1',frente:"O que é registro prévio de hipóteses?",verso:"Registrar, antes da coleta, o que será testado e como, reduzindo escolhas analíticas posteriores."},
  {id:'m10-a5-c2',frente:"Por que resultados negativos importam?",verso:"Porque informam limites e correções, e fazem parte do progresso científico."}
 ]
},
'm10-a6':{
 modulo:10, titulo:"Ética em pesquisa com pessoas", nivel:"Iniciante", tempo:20, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.6",
 objetivos:["Listar princípios éticos básicos da pesquisa com pessoas","Reconhecer riscos de reidentificação","Entender que a relevância de uma hipótese não autoriza danos"],
 previos:"Reprodutibilidade e transparência.",
 previa:"Uma pesquisa com boa hipótese pode envolver riscos aos participantes?",
 previaResposta:"Pode. O valor científico de uma hipótese não autoriza procedimentos danosos nem a ocultação injustificada de riscos.",
 secoes:[
  {t:"Princípios e normas", p:["Pesquisas envolvendo seres humanos demandam avaliação de riscos, consentimento quando aplicável, proteção da privacidade e respeito à autonomia e à justiça. No Brasil, as normas do Conselho Nacional de Saúde, incluindo as Resoluções 466/2012 e 510/2016, oferecem referenciais específicos, e sua aplicação depende do desenho e do campo da pesquisa. Um projeto educacional que armazena respostas também deve considerar a proteção de dados."],
   pausa:{p:"Um questionário anônimo respondido por um grupo pequeno de colegas pode permitir a identificação de alguém?", r:"Sim, em alguns casos. Mesmo dados anonimizados exigem cuidado com o risco de reidentificação em conjuntos pequenos."}},
  {t:"Debates éticos desde o início", p:["A história da Psicologia registra pesquisas que hoje geram críticas éticas importantes. Debates éticos devem estar presentes desde a formulação do problema até a comunicação dos achados."]}
 ],
 erros:["“A hipótese é tão importante que justifica o risco.” Não: o valor científico não autoriza procedimentos danosos.","“Anonimizado é sempre seguro.” Não: em grupos pequenos há risco de reidentificação."],
 resumo:["Pesquisas com pessoas exigem avaliação de riscos e respeito à autonomia.","No Brasil, as Resoluções CNS 466/2012 e 510/2016 são referências centrais.","Dados anonimizados podem ser reidentificados em grupos pequenos.","Debates éticos acompanham toda a pesquisa."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a6-q1',enunciado:"Qual é um princípio básico da ética em pesquisa com pessoas?",alts:["Ocultar riscos para não atrasar o estudo.", "Avaliação de riscos e respeito à autonomia.", "Usar dados sem informar os participantes.", "Priorizar a hipótese acima de tudo."],correta:1,justificativa:"Avaliação de riscos, consentimento quando aplicável e respeito à autonomia são pilares da ética em pesquisa."},
  {id:'m10-a6-q2',enunciado:"Dados anonimizados em grupos pequenos exigem que cuidado?",alts:["Nenhum.", "Devem ser publicados com nomes.", "Atenção ao risco de reidentificação.", "Não podem ser analisados."],correta:2,justificativa:"Combinações de informações podem identificar alguém em grupos pequenos, mesmo sem nome."}
 ],
 cartoes:[
  {id:'m10-a6-c1',frente:"Quais resoluções brasileiras são citadas para pesquisa com seres humanos?",verso:"Resoluções CNS 466/2012 e 510/2016 (esta voltada às ciências humanas e sociais). Confirme a vigência antes de citar."},
  {id:'m10-a6-c2',frente:"Anonimização garante que ninguém seja identificado?",verso:"Não necessariamente. Em grupos pequenos, há risco de reidentificação."}
 ]
},
'm10-a7':{
 modulo:10, titulo:"Perguntas de pesquisa e revisão de literatura", nivel:"Iniciante", tempo:20, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.7",
 objetivos:["Diferenciar busca exploratória de revisão sistemática","Registrar as informações essenciais de um estudo","Comparar estudos com critério"],
 previos:"Ética em pesquisa com pessoas.",
 previa:"Ler só o resumo de um artigo basta para decidir se o resultado vale para você?",
 previaResposta:"Não. Decisões dependem de métodos, populações e resultados.",
 secoes:[
  {t:"Exploratória e sistemática", p:["Uma revisão de literatura identifica como um problema foi formulado, quais métodos já foram utilizados e onde permanecem incertezas. É importante distinguir a busca exploratória da revisão sistemática. Nesta última, critérios de busca, estratégias e procedimentos de síntese devem ser explicitados. Selecionar apenas artigos que confirmam uma preferência teórica fragiliza a conclusão."],
   pausa:{p:"Qual é o risco de selecionar apenas os artigos que confirmam a sua opinião?", r:"Cria uma visão enviesada da evidência, porque deixa de lado estudos que poderiam contradizê-la."}},
  {t:"Registrar o que você lê", p:["Um resumo não substitui a leitura de métodos e resultados quando a decisão depende de detalhes. O estudante deve registrar população, delineamento, variáveis, instrumentos, resultados principais e limitações. Comparar estudos requer observar se investigaram de fato o mesmo fenômeno sob condições semelhantes."]}
 ],
 erros:["“O resumo do artigo basta.” Não quando a decisão depende de métodos e populações.","“Mais artigos concordando significa certeza.” Não sem avaliar a qualidade e a comparabilidade dos estudos."],
 resumo:["Revisão sistemática explicita critérios e procedimentos.","Registrar população, métodos, resultados e limitações.","Comparar estudos exige verificar se investigaram o mesmo fenômeno.","Resumos não substituem a leitura de métodos."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a7-q1',enunciado:"Qual é a principal diferença entre busca exploratória e revisão sistemática?",alts:["A exploratória é sempre mais rigorosa.", "Não há diferença.", "A sistemática não usa artigos.", "A sistemática explicita critérios, estratégias de busca e síntese."],correta:3,justificativa:"A revisão sistemática torna explícitos seus critérios e procedimentos, o que permite avaliar e reproduzir a síntese."},
  {id:'m10-a7-q2',enunciado:"Ao comparar dois estudos, o que deve ser verificado primeiro?",alts:["Se investigaram de fato o mesmo fenômeno sob condições semelhantes.", "O número de páginas.", "O ano da capa.", "O tamanho da fonte."],correta:0,justificativa:"Comparar estudos que medem coisas diferentes leva a conclusões equivocadas."}
 ],
 cartoes:[
  {id:'m10-a7-c1',frente:"O que registrar ao ler um artigo?",verso:"População, delineamento, variáveis, instrumentos, resultados principais e limitações."},
  {id:'m10-a7-c2',frente:"Por que um resumo não substitui a leitura de métodos?",verso:"Porque decisões dependem de detalhes sobre população, medidas e análise."}
 ]
},
'm10-a8':{
 modulo:10, titulo:"Tamanho de efeito, intervalos e incerteza", nivel:"Intermediário", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.8",
 objetivos:["Interpretar tamanho de efeito em relação à escala","Entender o que um intervalo de confiança comunica","Discutir importância prática além da significância"],
 previos:"Correlação, causalidade e interpretação estatística.",
 previa:"Um grupo melhorou 2 pontos em uma escala de 0 a 100. Isso é muito ou pouco?",
 previaResposta:"Não dá para saber sem olhar a variabilidade da escala, o contexto e o custo da mudança. A magnitude depende da referência.",
 secoes:[
  {t:"Magnitude e incerteza", p:["Uma diferença entre grupos precisa ser interpretada em relação à escala utilizada, à variabilidade e à precisão da estimativa. O valor de p oferece informação relativa a um modelo estatístico e seus pressupostos, mas não constitui a probabilidade de a hipótese científica ser verdadeira. Tamanhos de efeito ajudam a discutir magnitude; intervalos de confiança comunicam uma faixa de valores compatíveis com determinado procedimento inferencial."],
   pausa:{p:"O que indica um intervalo de confiança amplo?", r:"Maior incerteza sobre a estimativa, geralmente por amostra pequena ou alta variabilidade."}},
  {t:"Importância prática", p:["Em Psicologia, uma relação pequena pode ser interessante sob certas condições e insuficiente para decisões clínicas ou educacionais individuais. Um resultado com amostra reduzida pode ser impreciso, mesmo que atraia interesse. A importância prática deve considerar custos, benefícios, possíveis efeitos adversos e contextos de aplicação. Gráficos precisam apresentar eixos, unidades e incerteza de modo transparente."]}
 ],
 erros:["“p pequeno significa efeito grande.” Não: são informações diferentes.","“Efeito pequeno é inútil.” Depende de custos, benefícios e contexto."],
 resumo:["Magnitude se interpreta na escala e com a variabilidade.","Intervalos de confiança mostram a incerteza da estimativa.","Relevância prática vai além da significância.","Gráficos devem mostrar eixos, unidades e incerteza."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a8-q1',enunciado:"Por que um tamanho de efeito pequeno pode ser insuficiente para uma decisão individual?",alts:["Porque tamanhos pequenos são sempre falsos.", "Porque a relevância prática depende de custos, benefícios, contexto e aplicação individual.", "Porque efeitos pequenos não existem.", "Porque só valem em laboratório."],correta:1,justificativa:"Magnitude estatística não define sozinha a utilidade prática para uma pessoa específica."},
  {id:'m10-a8-q2',enunciado:"O valor de p mede a probabilidade de a hipótese ser verdadeira?",alts:["Sim.", "Sim, se for menor que 0,05.", "Não; é informação relativa a um modelo estatístico e seus pressupostos.", "Mede o tamanho da amostra."],correta:2,justificativa:"O valor de p não mede a probabilidade de a hipótese ser verdadeira."}
 ],
 cartoes:[
  {id:'m10-a8-c1',frente:"O que é tamanho de efeito?",verso:"Medida da magnitude de uma diferença ou associação, que ajuda a discutir sua importância."},
  {id:'m10-a8-c2',frente:"O que um intervalo de confiança comunica?",verso:"Uma faixa de valores compatíveis com o procedimento inferencial usado."}
 ]
},
'm10-a9':{
 modulo:10, titulo:"Causalidade, confundimento e desenho experimental", nivel:"Intermediário", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.9",
 objetivos:["Identificar confundimento em um caso hipotético","Entender a função da alocação aleatória","Formular hipóteses rivais"],
 previos:"Desenhos de pesquisa; tamanho de efeito.",
 previa:"Estudantes que usam um recurso digital têm notas melhores. O recurso causou a diferença?",
 previaResposta:"Não necessariamente. Podem existir diferenças prévias de tempo disponível, motivação ou apoio familiar.",
 secoes:[
  {t:"Confundimento e seleção", p:["Imagine que estudantes que usam um recurso digital apresentam melhores resultados do que estudantes que não o usam. Isso pode refletir a eficácia do recurso, mas também seleção: tempo disponível, motivação anterior ou apoio familiar podem diferir entre os grupos. Uma alocação aleatória, quando viável e ética, ajuda a equilibrar algumas alternativas, embora não elimine todas as ameaças metodológicas."],
   pausa:{p:"Por que a alocação aleatória ajuda na inferência causal?", r:"Ela distribui ao acaso as características prévias entre os grupos, reduzindo a chance de diferenças sistemáticas. Não elimina todas as ameaças, mas ajuda bastante."}},
  {t:"Cenário contrafactual e hipóteses rivais", p:["Estudos longitudinais, controles estatísticos e desenhos quase-experimentais podem complementar pesquisas; todos dependem de pressupostos. A análise causal madura explicita o cenário contrafactual que está sendo aproximado e reconhece o que não pode ser medido. Um aplicativo deve evitar apresentar relações observacionais como “comprovadamente causais” e ensinar a formular hipóteses rivais."]}
 ],
 aprofundar:{t:"Contrafactual, em palavras simples", p:["Pergunte: o que teria acontecido com a mesma pessoa, ou com o mesmo grupo, se a condição não tivesse ocorrido? Não é possível observar as duas situações ao mesmo tempo; por isso os desenhos buscam aproximações."]},
 erros:["“Grupos diferentes em tudo só mudam o resultado sem causa.” Pode haver diferenças prévias que explicam o resultado.","“Controle estatístico resolve qualquer confundimento.” Só trata variáveis medidas e depende de pressupostos."],
 resumo:["Grupos podem diferir antes da intervenção.","Alocação aleatória equilibra características prévias.","Hipóteses rivais devem ser consideradas.","Relações observacionais não são automaticamente causais."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a9-q1',enunciado:"Qual é a função de uma alocação aleatória?",alts:["Garantir que todos os grupos sejam idênticos em tudo.", "Eliminar a necessidade de hipóteses.", "Substituir a mensuração.", "Distribuir ao acaso características prévias, reduzindo diferenças sistemáticas entre grupos."],correta:3,justificativa:"A aleatorização reduz diferenças sistemáticas, mas não garante grupos idênticos em todos os aspectos."},
  {id:'m10-a9-q2',enunciado:"Por que hipóteses rivais são importantes?",alts:["Porque ajudam a considerar explicações alternativas para o mesmo resultado.", "Porque obrigam a repetir o estudo.", "Porque são obrigatórias por lei.", "Porque tornam o estudo mais curto."],correta:0,justificativa:"Considerar explicações alternativas evita conclusões causais precipitadas."}
 ],
 cartoes:[
  {id:'m10-a9-c1',frente:"O que é uma hipótese rival?",verso:"Uma explicação alternativa que também pode produzir o resultado observado."},
  {id:'m10-a9-c2',frente:"O que é um cenário contrafactual?",verso:"O que teria acontecido com a mesma pessoa ou grupo se a condição não tivesse ocorrido."}
 ]
},
'm10-a10':{
 modulo:10, titulo:"Qualitativo: perguntas, material e interpretação", nivel:"Intermediário", tempo:20, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.10",
 objetivos:["Reconhecer critérios de rigor qualitativo","Descrever como um material qualitativo é construído","Entender cuidados éticos na divulgação de falas"],
 previos:"Desenhos de pesquisa.",
 previa:"Uma pesquisa com entrevistas precisa seguir regras? Ou basta conversar com pessoas e interpretar?",
 previaResposta:"Precisa de método: explicar como os participantes foram escolhidos, como o registro foi feito e como as categorias foram construídas.",
 secoes:[
  {t:"Critérios de rigor", p:["Pesquisas qualitativas podem investigar experiências, práticas, discursos e processos em contextos complexos. Seus critérios de rigor incluem coerência entre problema e método, transparência das decisões analíticas, reflexividade e apresentação de material que sustente as interpretações. Não se deve exigir que toda pesquisa qualitativa simule um experimento, nem tratá-la como relato livre sem método."],
   pausa:{p:"Qual é a diferença entre um relato livre e uma pesquisa qualitativa?", r:"A pesquisa qualitativa explica como os dados foram gerados e analisados, com critérios explícitos. O relato livre não tem esse percurso."}},
  {t:"Material e ética", p:["Entrevistas, observações participantes e análise documental oferecem materiais diferentes. O pesquisador precisa explicar como os participantes foram escolhidos, como o registro foi feito, que categorias foram construídas e como os casos discrepantes foram tratados. O envolvimento com contextos sociais exige atenção ética e responsabilidade na divulgação das falas."]}
 ],
 erros:["“Qualitativo é só opinião.” Não: tem critérios de rigor próprios.","“Qualitativo deve imitar experimento.” Não: cada método tem suas próprias exigências."],
 resumo:["Pesquisas qualitativas têm critérios próprios de rigor.","É preciso explicar seleção de participantes, registro e categorias.","Reflexividade e transparência analítica são centrais.","Falas podem identificar pessoas e exigem cuidado."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a10-q1',enunciado:"Qual critério é específico do rigor qualitativo?",alts:["Replicação exata de um experimento.", "Transparência das decisões analíticas e reflexividade.", "Uso de amostras grandes.", "Ausência de registro."],correta:1,justificativa:"Transparência e reflexividade são critérios próprios de rigor em pesquisas qualitativas."},
  {id:'m10-a10-q2',enunciado:"Por que a divulgação de falas exige cuidado ético?",alts:["Porque falas nunca são úteis.", "Porque só pesquisas quantitativas divulgam dados.", "Porque falas podem identificar pessoas e expor contextos vulneráveis.", "Porque não há normas sobre isso."],correta:2,justificativa:"Falas podem revelar identidades e situações sensíveis, mesmo sem o nome da pessoa."}
 ],
 cartoes:[
  {id:'m10-a10-c1',frente:"Quais critérios de rigor valem para pesquisas qualitativas?",verso:"Coerência entre problema e método, transparência analítica, reflexividade e material que sustente as interpretações."},
  {id:'m10-a10-c2',frente:"Por que cuidar da divulgação de falas?",verso:"Porque podem identificar participantes e expor contextos vulneráveis."}
 ]
},
'm10-a11':{
 modulo:10, titulo:"Revisões sistemáticas, meta-análises e heterogeneidade", nivel:"Intermediário", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10.11",
 objetivos:["Explicar o que uma revisão sistemática faz","Entender o que uma meta-análise combina e o que não corrige","Interpretar heterogeneidade"],
 previos:"Revisão de literatura; tamanho de efeito.",
 previa:"Uma média combinada de vários estudos mostra um efeito que vale para todos os contextos?",
 previaResposta:"Nem sempre. Uma média pode esconder efeitos que variam conforme participantes, procedimentos e contextos.",
 secoes:[
  {t:"Síntese de evidências", p:["A síntese de evidências pode reunir estudos sobre uma intervenção ou fenômeno para avaliar o conjunto de resultados. Revisões sistemáticas explicitam pergunta, busca, critérios e avaliação de qualidade. Meta-análises combinam estimativas quando isso é apropriado, mas não corrigem automaticamente os limites dos estudos incluídos."],
   pausa:{p:"Uma meta-análise corrige um estudo mal feito incluído nela?", r:"Não. Ela combina estimativas; se os estudos têm limites, eles continuam presentes na síntese."}},
  {t:"Heterogeneidade e viés de publicação", p:["A heterogeneidade pode indicar diferenças de participantes, procedimentos, medidas e contextos. Uma média combinada pode esconder que os efeitos variam. Também é necessário considerar viés de publicação e conflitos de interesse, além de verificar atualizações posteriores.","O estudante deve registrar não apenas “o estudo encontrou efeito”, mas também tamanho, incerteza, contexto e limitações."]}
 ],
 erros:["“A média resolve a dúvida.” Não: pode esconder variação entre contextos.","“Revisão sistemática é garantia de verdade.” Ela é tão boa quanto os estudos incluídos e os critérios usados."],
 resumo:["Revisões sistemáticas explicitam pergunta, busca e critérios.","Meta-análises combinam estimativas, mas não corrigem limites dos estudos.","Heterogeneidade indica variação entre contextos e métodos.","Registrar tamanho, incerteza, contexto e limitações."],
 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a11-q1',enunciado:"O que a heterogeneidade pode indicar?",alts:["Que todos os estudos são iguais.", "Que o estudo é falso.", "Que não há efeito.", "Diferenças de participantes, procedimentos, medidas ou contextos."],correta:3,justificativa:"Heterogeneidade indica variação entre estudos, que pode refletir diferenças metodológicas ou de contexto."},
  {id:'m10-a11-q2',enunciado:"O que deve ser registrado ao resumir uma revisão?",alts:["Tamanho do efeito, incerteza, contexto e limitações.", "Apenas se o estudo encontrou efeito.", "Somente o nome dos autores.", "Somente a conclusão."],correta:0,justificativa:"Um resumo fiel informa magnitude, incerteza, contexto e limitações, e não apenas a direção do resultado."}
 ],
 cartoes:[
  {id:'m10-a11-c1',frente:"O que uma média combinada pode esconder?",verso:"Variações do efeito entre contextos e participantes (heterogeneidade)."},
  {id:'m10-a11-c2',frente:"Por que o viés de publicação importa em revisões?",verso:"Porque resultados positivos tendem a ser publicados com mais frequência, o que distorce a síntese."}
 ]
},
'm10-a12':{
 modulo:10, titulo:"Laboratório do capítulo 10: avaliando um desenho", nivel:"Intermediário", tempo:25, disciplina:"Metodologia científica", fonte:"Caderno de Pesquisa, capítulo 10 (laboratório e verificação)", tipo:"laboratorio",
 objetivos:["Avaliar um desenho de pesquisa em um caso hipotético","Propor um desenho que investigue melhor a causalidade","Explicar as limitações de cada escolha"],

 secoes:[{t:"Como usar este laboratório", p:["Leia o caso, responda às perguntas antes de abrir as orientações e só então compare. Você está treinando um raciocínio, não buscando uma resposta memorizada."]}],
 caso:"Uma pesquisa encontra associação entre o uso de um aplicativo de estudo e notas altas. Quem usa o aplicativo também pode ter mais tempo disponível e maior motivação inicial. Proponha um desenho que investigue melhor a causalidade, explicando suas limitações.",
 casoPerguntas:["Que variáveis podem confundir a relação?","Que desenho melhora a inferência causal, e quais são suas limitações?","O que deve ser medido com cuidado?"],
 critica:"O que deve mudar na confiança depositada em um resultado quando ele não se replica em um contexto diferente?",
 criticaResposta:"A confiança na generalização deve diminuir, e a exigência de novos estudos deve aumentar. Uma replicação que falha indica limites do resultado, e não necessariamente um erro grave do primeiro estudo.",
 erros:["Confundir associação com causalidade.","Tratar um estudo isolado como regra."],
