 referencias:REF_CAP10,
 questoes:[
  {id:'m10-a12-q1',enunciado:"Uma correlação elevada prova causalidade?",alts:["Sim.", "Não; desenho, alternativas e pressupostos precisam ser examinados.", "Sim, se a amostra for grande.", "Sim, se a estatística for complexa."],correta:1,justificativa:"Correlação elevada indica associação. A causalidade depende do desenho, das hipóteses rivais e dos pressupostos."},
  {id:'m10-a12-q2',enunciado:"O que é operacionalizar uma variável?",alts:["Substituir a variável por uma opinião.", "Eliminar a mensuração.", "Definir os indicadores e procedimentos para investigá-la.", "Publicar os dados."],correta:2,justificativa:"Operacionalizar é definir como a variável será observada e medida."},
  {id:'m10-a12-q3',enunciado:"Por que o tamanho de efeito é importante?",alts:["Mostra apenas o número de participantes.", "Substitui os intervalos de confiança.", "É exigido apenas em experimentos.", "Mostra a magnitude da associação ou diferença, além da significância estatística."],correta:3,justificativa:"O tamanho de efeito informa magnitude, que a significância estatística não informa sozinha."},
  {id:'m10-a12-q4',enunciado:"O que a pré-inscrição de um estudo ajuda a evitar?",alts:["Flexibilizar hipóteses e análises depois de conhecer os resultados, sem transparência.", "Erros de digitação.", "Custos de impressão.", "Revisões por pares."],correta:0,justificativa:"O registro prévio torna explícitas hipóteses e análises planejadas, reduzindo escolhas oportunistas."},
  {id:'m10-a12-q5',enunciado:"Quais cuidados são essenciais em pesquisas com pessoas?",alts:["Nenhum, se o estudo for interessante.", "Avaliação de riscos, consentimento quando aplicável, privacidade e respeito.", "Publicar nomes para dar transparência.", "Usar dados sem informar os participantes."],correta:1,justificativa:"Riscos, consentimento, privacidade e respeito são pilares éticos da pesquisa com pessoas."}
 ],
 cartoes:[
  {id:'m10-a12-c1',frente:"Qual a diferença entre um desenho observacional e um experimental?",verso:"O observacional registra associações sem manipular condições. O experimental manipula condições com controle e pode apoiar inferência causal."},
  {id:'m10-a12-c2',frente:"Por que um resultado que não se replica deve reduzir a confiança?",verso:"Porque indica que o resultado pode depender do contexto, da amostra ou do método, e precisa de mais evidências."}
 ]
}

 previaResposta:"Não. Dados pessoais devem ser mínimos e justificados pela finalidade.",
 secoes:[
  {t:"Proteção de informações", p:["Informações psicológicas podem ser muito sensíveis. Boas práticas de proteção incluem minimizar a coleta, esclarecer a finalidade, controlar o acesso e impedir exposição desnecessária. A LGPD brasileira regula o tratamento de dados pessoais e estabelece princípios como finalidade, adequação, necessidade e segurança. Plataformas de estudo não devem exigir relatos íntimos para funcionar."],
   pausa:{p:"Por que dados anonimizados ainda exigem cuidado?", r:"Porque, em grupos pequenos, a combinação de informações pode reidentificar alguém."}},
  {t:"Casos de exemplo", p:["No contexto acadêmico, exemplos de casos devem ser fictícios ou devidamente autorizados e protegidos. Não se deve divulgar mensagens, prontuários ou identificadores de pacientes em grupos de aula."]}
 ],
 erros:["“Se não tem nome, pode circular.” Não: combinações de informações podem identificar pessoas.","“Mais dados deixam o app melhor.” Não: dados devem ser necessários à finalidade."],
 resumo:["Minimizar a coleta é a primeira proteção.","A LGPD orienta finalidade, adequação, necessidade e segurança.","Casos de aula devem ser fictícios ou autorizados.","Dados anonimizados podem ser reidentificados."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a3-q1',enunciado:"O que a LGPD estabelece como princípio?",alts:["Coletar o máximo de dados possível.", "Compartilhar dados com qualquer empresa.", "Finalidade, adequação, necessidade e segurança.", "Dispensar consentimento sempre."],correta:2,justificativa:"Esses são princípios centrais do tratamento de dados pessoais na LGPD."},
  {id:'m11-a3-q2',enunciado:"Qual exemplo para aula é adequado?",alts:["Mensagem real de um paciente.", "Prontuário de um colega.", "Relato íntimo de um amigo.", "Caso fictício que permite analisar princípios."],correta:3,justificativa:"Casos fictícios permitem analisar princípios sem expor pessoas reais."}
 ],
 cartoes:[
  {id:'m11-a3-c1',frente:"Quais são boas práticas de proteção de dados?",verso:"Minimizar a coleta, definir a finalidade, controlar o acesso e evitar exposição desnecessária."},
  {id:'m11-a3-c2',frente:"Qual lei brasileira regula dados pessoais?",verso:"A LGPD, Lei nº 13.709/2018. Confirme a versão consolidada atual antes de citar."}
 ]
},
'm11-a4':{
 modulo:11, titulo:"Avaliação psicológica e SATEPSI", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.4",
 objetivos:["Explicar o que é avaliação psicológica como processo","Entender o papel do SATEPSI","Reconhecer testes recreativos que se passam por diagnóstico"],
 previos:"Código de Ética; sigilo e dados.",
 previa:"Um teste que promete “descobrir seu transtorno em cinco perguntas” é confiável?",
 previaResposta:"Não há base para isso. Ele confunde educação, mensuração e diagnóstico, e não apresenta estudos de validação.",
 secoes:[
  {t:"Avaliação e sistema", p:["Avaliação psicológica é um processo profissional que pode combinar fontes fundamentais e complementares de informação, de modo planejado. O Sistema de Avaliação de Testes Psicológicos (SATEPSI), administrado pelo CFP, fornece informações sobre a qualidade técnico-científica dos instrumentos. A Resolução CFP 31/2022 disciplina a avaliação e o SATEPSI, substituindo a resolução anterior, de 2018."],
   pausa:{p:"O que o SATEPSI informa sobre um instrumento?", r:"Informações sobre qualidade técnico-científica e condições de uso profissional, que servem de base para decidir se o instrumento é adequado."}},
  {t:"Aprender sem aplicar", p:["O estudante pode aprender conceitos de validade e confiabilidade sem aplicar testes psicológicos privativos ou divulgar itens protegidos. Uma versão segura do PsicoBase deve preferir exercícios de teoria e metodologia, sem produzir laudos ou classificações clínicas."]}
 ],
 alerta:"Este app não aplica testes, não gera laudos e não classifica pessoas.",
 erros:["“Quiz curto diagnostica.” Não: diagnóstico exige processo profissional e instrumentos validados para essa finalidade.","“SATEPSI é um teste.” Não: é o sistema que informa a qualidade técnica dos instrumentos."],
 resumo:["Avaliação psicológica é um processo profissional planejado.","O SATEPSI informa a qualidade técnico-científica dos instrumentos.","A Resolução CFP 31/2022 disciplina avaliação e SATEPSI.","Estudar validade não exige aplicar testes privativos."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a4-q1',enunciado:"Qual é o papel do SATEPSI?",alts:["Avaliar e divulgar condições técnico-científicas de instrumentos psicológicos.", "Aplicar testes a estudantes.", "Diagnosticar transtornos.", "Vender testes."],correta:0,justificativa:"O SATEPSI informa a qualidade técnico-científica e as condições de uso dos instrumentos. Não aplica testes nem diagnostica."},
  {id:'m11-a4-q2',enunciado:"Por que exercícios acadêmicos não equivalem a avaliação psicológica?",alts:["Porque são mais curtos.", "Porque avaliação exige competência, métodos profissionais e normas próprias.", "Porque exercícios são sempre corretos.", "Porque avaliação é gratuita."],correta:1,justificativa:"Avaliação profissional envolve formação, competência, métodos e normas que um exercício didático não contempla."}
 ],
 cartoes:[
  {id:'m11-a4-c1',frente:"Qual resolução trata de avaliação e SATEPSI, segundo o PDF?",verso:"Resolução CFP 31/2022, que substituiu a 09/2018. Confirme a vigência antes de citar."},
  {id:'m11-a4-c2',frente:"Um teste rápido na internet pode diagnosticar?",verso:"Não. Diagnóstico exige processo profissional e instrumentos validados para essa finalidade."}
 ]
},
'm11-a5':{
 modulo:11, titulo:"SUS, RAPS e atuação comunitária", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.5",
 objetivos:["Situar a Psicologia em redes de saúde e políticas públicas","Entender o papel da RAPS","Reconhecer a importância de consultar normas atualizadas"],
 previos:"Avaliação psicológica e SATEPSI.",
 previa:"A Psicologia atua apenas em consultórios?",
 previaResposta:"Não. Atua em redes de saúde, educação, assistência social e outras políticas públicas.",
 secoes:[
  {t:"Rede de atenção", p:["A atuação psicológica no Brasil inclui a rede de atenção em saúde, educação, assistência social e outras políticas públicas. A Rede de Atenção Psicossocial (RAPS) articula serviços de diferentes graus de complexidade, e seu marco normativo recebe atualizações; por isso é importante consultar a legislação consolidada e os materiais atuais do Ministério da Saúde. A perspectiva de cuidado em rede considera pessoas, famílias, território e direitos."],
   pausa:{p:"Por que a legislação deve ser consultada na versão atual?", r:"Porque as normas são atualizadas. Citar uma versão antiga pode levar a informações incorretas sobre serviços e direitos."}},
  {t:"Referências técnicas", p:["O Centro de Referência Técnica em Psicologia e Políticas Públicas (CREPOP) reúne referências para diferentes campos, inclusive educação básica, atenção básica e populações vulnerabilizadas. A leitura desses materiais amplia a visão sobre a Psicologia além do consultório e ajuda a compreender o papel ético-político da profissão, sem reduzir a análise à opinião pessoal."]}
 ],
 erros:["“RAPS é só hospital.” Não: articula serviços de diferentes complexidades.","“Uma norma antiga continua valendo.” Confira sempre a versão atual em fontes oficiais."],
 resumo:["A Psicologia atua em redes de saúde, educação e assistência.","A RAPS articula serviços de diferentes complexidades.","O CREPOP reúne referências técnicas para políticas públicas.","Normas devem ser verificadas em fontes atualizadas."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a5-q1',enunciado:"O que a RAPS articula?",alts:["Apenas hospitais psiquiátricos.", "Consultórios particulares.", "Serviços de diferentes graus de complexidade em uma rede de cuidado.", "Somente escolas."],correta:2,justificativa:"A RAPS é uma rede, que articula serviços de diferentes complexidades e níveis de atenção."},
  {id:'m11-a5-q2',enunciado:"Por que consultar materiais atuais do Ministério da Saúde?",alts:["Porque materiais antigos são proibidos.", "Porque não há legislação.", "Porque são mais bonitos.", "Porque normas e organização de serviços podem ser atualizadas."],correta:3,justificativa:"Normas e organização de serviços mudam, e informações desatualizadas levam a erros."}
 ],
 cartoes:[
  {id:'m11-a5-c1',frente:"O que é a RAPS?",verso:"Rede de Atenção Psicossocial, que articula serviços de diferentes complexidades no SUS."},
  {id:'m11-a5-c2',frente:"O que é o CREPOP?",verso:"Centro de Referência Técnica em Psicologia e Políticas Públicas, que reúne referências para atuação em políticas públicas."}
 ]
},
'm11-a6':{
 modulo:11, titulo:"Diversidade, direitos e reflexão crítica", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.6",
 objetivos:["Considerar diferenças sociais, culturais e históricas na atuação","Identificar barreiras de acesso","Formular perguntas eticamente responsáveis"],
 previos:"SUS, RAPS e atuação comunitária.",
 previa:"Conhecer uma teoria autoriza impor valores a outras pessoas?",
 previaResposta:"Não. A prática pede escuta, capacidade de revisão e atenção a evidências e diretrizes pertinentes.",
 secoes:[
  {t:"Diferenças e poder", p:["A atuação respeitosa exige considerar diferenças individuais, sociais, culturais, territoriais e históricas, inclusive relações de poder e barreiras de acesso. Conhecer uma teoria não autoriza impor valores a pessoas ou grupos. A prática profissional pede escuta, capacidade de revisão e atenção a evidências e diretrizes pertinentes."],
   pausa:{p:"Cite uma barreira de acesso que pode afetar a participação de alguém em um serviço.", r:"Por exemplo: transporte, horário de funcionamento, custo, discriminação ou falta de serviço no território. Exemplos devem considerar o contexto real da pessoa."}},
  {t:"Perguntas responsáveis", p:["Para um estudante iniciante, a atividade mais importante é formular perguntas eticamente responsáveis: quais pessoas podem ser prejudicadas por determinada interpretação? quais dados são necessários? o procedimento exige autorização ou competência específica? Em situações reais, consultar docentes e órgãos profissionais faz parte da responsabilidade."]}
 ],
 erros:["“Eu sei a teoria, então sei o que é melhor para a pessoa.” Não: conhecer uma teoria não autoriza impor valores.","“Em caso real, basta a minha opinião.” Não: é preciso consultar normas e pessoas competentes."],
 resumo:["Diferenças sociais, culturais e históricas importam na atuação.","Teoria não autoriza impor valores.","Perguntas éticas antecedem qualquer decisão.","Em casos reais, consulte docentes e órgãos profissionais."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a6-q1',enunciado:"Qual é a pergunta ética que um estudante iniciante deve fazer?",alts:["Quem pode ser prejudicado por esta interpretação?", "Qual é o resultado mais bonito?", "Como ganhar tempo?", "Quem paga a conta?"],correta:0,justificativa:"Antecipar possíveis danos é a base do raciocínio ético responsável."},
  {id:'m11-a6-q2',enunciado:"Em uma situação real, o que faz parte da responsabilidade?",alts:["Agir sozinho, sem consulta.", "Consultar docentes e órgãos profissionais.", "Ignorar as normas.", "Publicar o caso."],correta:1,justificativa:"Consultar quem tem competência e supervisão é parte da conduta responsável."}
 ],
 cartoes:[
  {id:'m11-a6-c1',frente:"Conhecer uma teoria autoriza impor valores?",verso:"Não. A prática exige escuta, revisão e atenção a evidências e diretrizes."},
  {id:'m11-a6-c2',frente:"Quais perguntas éticas fazer antes de interpretar?",verso:"Quem pode ser prejudicado, quais dados são necessários e se o procedimento exige autorização ou competência específica."}
 ]
},
'm11-a7':{
 modulo:11, titulo:"De princípios éticos a decisões responsáveis", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.7",
 objetivos:["Reconhecer deveres que entram em tensão","Usar um roteiro de raciocínio ético","Aplicar a regra de exemplos fictícios"],
 previos:"Diversidade, direitos e reflexão crítica.",
 previa:"Quando dois deveres éticos entram em conflito, qual deve vencer automaticamente?",
 previaResposta:"Nenhum automaticamente. É preciso identificar o problema, consultar normas, avaliar alternativas e buscar supervisão quando apropriado.",
 secoes:[
  {t:"Tensões entre deveres", p:["O trabalho psicológico envolve situações em que deveres podem entrar em tensão: proteção da privacidade, autonomia, prevenção de danos, demandas institucionais e exigências legais. O raciocínio ético não pode ser reduzido a aplicar um slogan ou a escolher o desejo imediato de uma das partes. É necessário identificar o problema, consultar normas vigentes, avaliar alternativas e buscar supervisão qualificada quando apropriado."],
   pausa:{p:"Qual é o risco de decidir com base em um slogan?", r:"Simplificar um problema complexo e ignorar as consequências para uma das partes ou para terceiros."}},
  {t:"Casos fictícios", p:["O estudante deve evitar discutir casos reais identificáveis em grupos informais. Mesmo exemplos acadêmicos precisam ser apresentados com cuidado e sem expor pessoas vulneráveis. Um bom exercício apresenta informações fictícias suficientes para analisar princípios, não para simular um parecer técnico. O Código de Ética é essencial, mas sua interpretação no cotidiano depende também de outras normas e do contexto institucional."]}
 ],
 erros:["“Slogan resolve dilema.” Não: dilemas exigem análise de deveres e consequências.","“Caso fictício pode imitar parecer técnico.” Não: serve para analisar princípios."],
 resumo:["Deveres podem entrar em tensão.","Um roteiro: identificar, consultar normas, avaliar alternativas, buscar supervisão.","Exemplos devem ser fictícios.","O Código depende de normas e contexto institucional."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a7-q1',enunciado:"Qual é uma etapa adequada do raciocínio ético?",alts:["Aplicar um slogan.", "Escolher o desejo imediato.", "Identificar o problema e consultar normas vigentes.", "Evitar qualquer consulta."],correta:2,justificativa:"O roteiro começa por identificar o problema e consultar normas atualizadas."},
  {id:'m11-a7-q2',enunciado:"Por que um exemplo acadêmico deve ser fictício?",alts:["Para ser mais divertido.", "Porque casos reais nunca existem.", "Porque o Código exige.", "Para analisar princípios sem expor pessoas reais e vulneráveis."],correta:3,justificativa:"Casos fictícios permitem estudar princípios sem expor pessoas e sem simular parecer técnico."}
 ],
 cartoes:[
  {id:'m11-a7-c1',frente:"Quais são as etapas do raciocínio ético sugeridas?",verso:"Identificar o problema, consultar normas vigentes, avaliar alternativas e buscar supervisão quando apropriado."},
  {id:'m11-a7-c2',frente:"Por que exemplos devem ser fictícios?",verso:"Para não expor pessoas reais e vulneráveis, e para não simular um parecer técnico."}
 ]
},
'm11-a8':{
 modulo:11, titulo:"Competência e limites de atuação", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.8",
 objetivos:["Explicar o que compõe a competência profissional","Entender que ler sobre uma técnica não habilita para aplicá-la","Reconhecer os limites do PsicoBase"],
 previos:"De princípios éticos a decisões responsáveis.",
 previa:"Ler um livro sobre uma técnica habilita alguém a aplicá-la?",
 previaResposta:"Não. Competência envolve formação, supervisão, experiência e atualização.",
 secoes:[
  {t:"Competência", p:["Competência profissional envolve formação, experiência, atualização e adequação dos métodos ao problema. Conhecer um autor ou uma técnica em livro não confere habilitação para conduzir avaliações, testes privativos ou intervenções clínicas. O reconhecimento dos próprios limites é parte da conduta responsável, não uma demonstração de fraqueza."],
   pausa:{p:"Por que reconhecer limites faz parte da conduta responsável?", r:"Porque aplicar métodos além da competência pode causar dano. Buscar apoio é a forma correta de cuidar da pessoa."}},
  {t:"Formação e limites do app", p:["A formação universitária desenvolve essas competências por meio de aulas, pesquisa, supervisão e atividades práticas, e segue marcos curriculares e profissionais. A proposta do PsicoBase é apoiar o estudo, o vocabulário e o pensamento crítico. Ele não pode substituir a universidade nem conferir autorização profissional. Ao projetar exercícios, deixe clara a diferença entre uma questão de teoria e uma decisão aplicada a uma pessoa real."]}
 ],
 erros:["“Li, então posso aplicar.” Não: competência exige formação e supervisão.","“O app me habilita.” Não: ele apoia o estudo, não confere autorização profissional."],
 resumo:["Competência envolve formação, supervisão, experiência e atualização.","Ler sobre uma técnica não habilita para aplicá-la.","Reconhecer limites é parte da conduta responsável.","O app apoia o estudo, mas não confere autorização."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a8-q1',enunciado:"Conhecer uma técnica pela leitura confere habilitação para aplicá-la?",alts:["Não; competência envolve formação, supervisão e atualização.", "Sim.", "Sim, se for um livro famoso.", "Sim, se o estudante for avançado."],correta:0,justificativa:"Habilitação depende de formação, supervisão, experiência e atualização, e não apenas da leitura."},
  {id:'m11-a8-q2',enunciado:"O que o PsicoBase pode e não pode fazer?",alts:["Pode substituir a universidade.", "Pode apoiar o estudo e o pensamento crítico, mas não confere autorização profissional.", "Pode conferir registro profissional.", "Pode autorizar intervenções clínicas."],correta:1,justificativa:"O app é uma ferramenta de estudo. Não substitui a formação nem confere autorização profissional."}
 ],
 cartoes:[
  {id:'m11-a8-c1',frente:"Ler sobre uma técnica habilita a aplicá-la?",verso:"Não. A habilitação depende de formação, supervisão, experiência e atualização."},
  {id:'m11-a8-c2',frente:"Qual a diferença entre questão de teoria e decisão aplicada?",verso:"A teoria explica conceitos. A decisão aplicada exige avaliar uma pessoa real, com competência e normas."}
 ]
},
'm11-a9':{
 modulo:11, titulo:"Privacidade desde o desenho do aplicativo", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.9",
 objetivos:["Entender privacidade desde o desenho do produto","Reconhecer riscos de campos íntimos em apps","Distinguir o que é enviado a serviços de IA"],
 previos:"Sigilo, dados e comunicação responsável.",
 previa:"Um app de estudo precisa de campos sobre experiências íntimas para ser útil?",
 previaResposta:"Não. Ele deve evitar campos que solicitem diagnósticos, traumas ou relatos clínicos para funcionar.",
 secoes:[
  {t:"Privacidade por padrão", p:["Um aplicativo de Psicologia pode, sem intenção, incentivar usuários a registrar experiências muito íntimas. O produto deve evitar campos que solicitem diagnósticos, traumas ou relatos clínicos para funcionar. Dados pessoais necessários ao acompanhamento do estudo podem ser mantidos localmente, quando possível, com exportação, exclusão e políticas transparentes de sincronização."],
   pausa:{p:"Por que manter dados localmente pode reduzir riscos?", r:"Porque reduz o número de lugares onde dados sensíveis ficam armazenados ou são transmitidos, diminuindo a exposição."}},
  {t:"IA e segurança", p:["Quando serviços de IA forem usados, é importante distinguir o que será enviado ao provedor e oferecer uma opção sem envio de anotações privadas. A LGPD orienta princípios de finalidade, necessidade, segurança e direitos dos titulares. O tratamento de dados sensíveis exige atenção especial e avaliação jurídica quando aplicável. A segurança deve incluir controle de acesso, proteção de credenciais e cuidado com logs, não apenas uma caixa genérica de consentimento."]}
 ],
 erros:["“Se tem consentimento, está tudo certo.” Não: a segurança e a necessidade também importam.","“A IA recebe tudo por padrão.” Deve haver transparência sobre o que é enviado."],
 resumo:["Evite campos que peçam relatos clínicos ou íntimos.","Mantenha dados localmente quando possível.","Distinga o que é enviado a serviços de IA.","Segurança inclui acesso, credenciais e logs."],
 referencias:REF_CAP11,
 questoes:[
  {id:'m11-a9-q1',enunciado:"O que um app de estudo deve evitar?",alts:["Exportação de dados.", "Controle de acesso.", "Campos que solicitem diagnósticos, traumas ou relatos clínicos para funcionar.", "Opção de exclusão de dados."],correta:2,justificativa:"Campos desse tipo não são necessários ao estudo e aumentam o risco de exposição."},
  {id:'m11-a9-q2',enunciado:"Ao usar IA, o que deve ser distinguido?",alts:["A cor do botão.", "O tamanho da fonte.", "O nome do desenvolvedor.", "O que será enviado ao provedor, com opção sem envio de anotações privadas."],correta:3,justificativa:"Transparência sobre o envio de dados e a opção de não enviar anotações privadas são cuidados centrais."}
 ],
 cartoes:[
  {id:'m11-a9-c1',frente:"Por que evitar campos de relatos clínicos em um app de estudo?",verso:"Porque esses dados não são necessários ao estudo e aumentam o risco de exposição."},
  {id:'m11-a9-c2',frente:"O que a segurança deve incluir além do consentimento?",verso:"Controle de acesso, proteção de credenciais e cuidado com logs."}
 ]
},
'm11-a10':{
 modulo:11, titulo:"Avaliação psicológica e uso adequado de instrumentos", nivel:"Intermediário", tempo:20, disciplina:"Ética e profissão no Brasil", fonte:"Caderno de Pesquisa, capítulo 11.10",
 objetivos:["Entender condições de uso de instrumentos","Estudar validade e padronização sem aplicar testes","Reconhecer o que não deve ser pedido ao usuário"],
 previos:"Avaliação psicológica e SATEPSI.",
 previa:"Um teste privativo encontrado na internet pode ser divulgado como entretenimento?",
 previaResposta:"Não. Divulgar itens protegidos ou apresentar testes privativos como entretenimento pode comprometer a ética e a validade.",
 secoes:[
  {t:"Condições de uso", p:["Uma avaliação psicológica profissional integra informações de acordo com objetivo, contexto, competência e normas. Os testes constituem instrumentos com requisitos técnicos e condições de uso; divulgar itens protegidos ou apresentar testes privativos como entretenimento pode comprometer a ética e a validade. O SATEPSI informa as condições de utilização profissional dos instrumentos avaliados."],
   pausa:{p:"Por que um teste recreativo não deve ser apresentado como avaliação?", r:"Porque ele não tem validação para essa finalidade, e a apresentação pode levar pessoas a acreditar em rótulos sem base."}},
  {t:"Estudo didático", p:["No aprendizado universitário, é relevante estudar confiabilidade, validade, padronização, normas e risco de viés. Isso pode ser feito com dados fictícios ou instrumentos didáticos não classificados como testes privativos, desde que não sejam vendidos nem apresentados como avaliação pessoal. Um aplicativo de estudos deve oferecer questões sobre os princípios de avaliação, sem solicitar que o usuário interprete resultados clínicos de terceiros."]}
 ],
 erros:["“Como é didático, pode divulgar os itens.” Não: itens protegidos não devem ser divulgados.","“O app pode pedir a interpretação de resultados de outras pessoas.” Não: está fora do escopo educacional."],
 resumo:["Instrumentos têm condições técnicas e de uso.","Itens protegidos não devem ser divulgados.","Estude validade e normas com dados fictícios.","O app não pede interpretação clínica de terceiros."],
 referencias:REF_CAP11,
 questoes:[

 secoes:[

   pausa:{p:"Por que a palavra “eficácia” precisa de um desfecho específico?", r:"Porque uma intervenção pode funcionar para uma condição e não para outra. É preciso dizer para quê e para quem."}},
  {t:"Limites da ferramenta educacional", p:["A utilização educacional do PsicoBase deve incluir alertas que separem a explicação conceitual da indicação personalizada. Se o estudante sentir sofrimento importante, deve procurar apoio humano adequado. Um tutor automatizado não deve prescrever condutas, aplicar testes restritos nem apresentar suas respostas como diagnóstico."]}
 ],
 erros:["“O app pode dizer o que fazer.” Não: explica conceitos e não prescreve condutas.","“Eficácia é universal.” Não: depende de problema, grupo e desfecho."],
 resumo:["O cuidado em saúde mental é multiprofissional.","A eficácia depende de problema, grupo e desfecho.","Explicação conceitual não é indicação personalizada.","Sofrimento importante exige apoio humano."],
 referencias:REF_CAP12,
 questoes:[
  {id:'m12-a5-q1',enunciado:"O que deve ser analisado antes de afirmar que uma intervenção funciona?",alts:["Apenas a opinião do autor.", "Problema, grupo e desfecho específicos.", "O preço do tratamento.", "A cor do material."],correta:1,justificativa:"A eficácia é sempre relativa a um problema, a um grupo e a um desfecho."},
  {id:'m12-a5-q2',enunciado:"Um tutor automatizado pode prescrever condutas?",alts:["Sim, se for preciso.", "Sim, em qualquer caso.", "Não; não deve prescrever condutas nem apresentar respostas como diagnóstico.", "Sim, se o usuário pedir."],correta:2,justificativa:"Ferramentas educacionais não prescrevem condutas nem diagnosticam pessoas."}
 ],
 cartoes:[
  {id:'m12-a5-c1',frente:"Uma única abordagem funciona para todas as condições?",verso:"Não. A eficácia depende do problema, do grupo e do desfecho considerados."},
  {id:'m12-a5-c2',frente:"O que um app educativo deve separar?",verso:"Explicação conceitual e indicação personalizada."}
 ]
},
'm12-a6':{
 modulo:12, titulo:"O perigo do autodiagnóstico por listas", nivel:"Intermediário", tempo:20, disciplina:"Psicopatologia e saúde mental", fonte:"Caderno de Pesquisa, capítulo 12.6", alerta:ALERTA_CAP12,
 objetivos:["Explicar por que listas de sintomas enganam","Distinguir reconhecer atenção de concluir transtorno","Identificar o que o PsicoBase pode perguntar"],
 previos:"Sintomas, sinais e classificações.",
 previa:"Você leu três sintomas em um site e concluiu que tem um transtorno. O que falta?",
 previaResposta:"Avaliação qualificada: duração, intensidade, impacto funcional, história clínica, contexto e diagnósticos diferenciais.",
 secoes:[
  {t:"Por que listas enganam", p:["A internet facilita o encontro de listas de sinais e sintomas, mas classificações clínicas dependem de contextos e critérios que ultrapassam o reconhecimento isolado de palavras. Pessoas diferentes podem relatar experiências semelhantes por razões distintas. Duração, intensidade, impacto funcional, história, outros fatores de saúde e avaliação adequada podem modificar a interpretação."],
   pausa:{p:"Duas pessoas relatam cansaço e tristeza. Elas têm o mesmo quadro?", r:"Não necessariamente. As causas, a duração, a intensidade e o impacto podem ser diferentes. Só uma avaliação qualificada pode esclarecer."}},
  {t:"Respeito sem diagnóstico", p:["Isso não significa desvalorizar experiências de sofrimento. O cuidado responsável considera a pessoa e o seu contexto, sem transformar o aplicativo educativo em avaliador clínico. O estudante deve distinguir reconhecer que algo merece atenção de concluir que existe determinado transtorno. Exercícios de psicopatologia podem perguntar sobre conceitos, classificação e limites da inferência, sem solicitar que alguém classifique pessoas reais."]}
 ],
 erros:["“Se um site descreve, eu tenho.” Não: descrição não é diagnóstico.","“Desvalorizar o sofrimento é ser racional.” Não: é possível levar o sofrimento a sério sem diagnosticar."],
 resumo:["Listas de sintomas não consideram contexto nem duração.","Reconhecer atenção não equivale a diagnosticar.","O cuidado considera a pessoa, não só o rótulo.","Exercícios não classificam pessoas reais."],
 referencias:REF_CAP12,
 questoes:[
  {id:'m12-a6-q1',enunciado:"Reconhecer que algo merece atenção equivale a concluir que existe um transtorno?",alts:["Sim.", "Sim, se os sintomas forem muitos.", "Sim, se o site for confiável.", "Não; são coisas diferentes, e a conclusão exige avaliação qualificada."],correta:3,justificativa:"Atenção ao sofrimento e diagnóstico são etapas distintas, com exigências diferentes."},
  {id:'m12-a6-q2',enunciado:"O que um exercício do PsicoBase pode perguntar sobre psicopatologia?",alts:["Conceitos, classificação e limites da inferência, sem classificar pessoas reais.", "Classificar colegas.", "Diagnósticos de pessoas conhecidas.", "Medicamentos para uso próprio."],correta:0,justificativa:"Exercícios podem tratar de conceitos e limites, sem classificar pessoas reais."}
 ],
 cartoes:[
  {id:'m12-a6-c1',frente:"Reconhecer sofrimento equivale a diagnosticar?",verso:"Não. Reconhecer que algo merece atenção não é concluir um transtorno. Isso exige avaliação qualificada."},
  {id:'m12-a6-c2',frente:"Por que checklists da internet não bastam?",verso:"Porque as classificações dependem de duração, impacto, história e contexto."}
 ]
},
'm12-a7':{
 modulo:12, titulo:"Fatores de risco, proteção e probabilidade", nivel:"Intermediário", tempo:20, disciplina:"Psicopatologia e saúde mental", fonte:"Caderno de Pesquisa, capítulo 12.7", alerta:ALERTA_CAP12,
 objetivos:["Diferenciar fator de risco de previsão individual","Entender fatores de proteção","Reconhecer determinantes estruturais"],
 previos:"Estigma e determinantes sociais.",
 previa:"Um fator de risco prevê o futuro de uma pessoa?",
 previaResposta:"Não. Ele indica maior probabilidade em uma população. Fatores de proteção podem modificar a trajetória.",
 secoes:[
  {t:"Risco é probabilidade", p:["Um fator de risco é uma condição associada a maior probabilidade de determinado desfecho em uma população. Não significa previsão inevitável para uma pessoa. Fatores protetivos podem modificar trajetórias, e seus efeitos dependem de contextos. Pesquisas observacionais enfrentam problemas de confundimento e causalidade reversa, o que exige cautela na interpretação das associações."],
   pausa:{p:"Por que um fator de risco não serve para prever o destino de uma pessoa?", r:"Porque ele descreve probabilidade populacional. Para uma pessoa, muitos outros fatores e contextos interagem."}},
  {t:"Determinantes sociais", p:["As condições sociais de saúde mental incluem oportunidades educacionais, segurança, moradia, vínculos, acesso a serviços e experiências de discriminação. Uma estratégia centrada exclusivamente em hábitos individuais pode negligenciar os determinantes estruturais. O relatório mundial da OMS oferece referência para discutir a necessidade de reorganizar ambientes e sistemas de cuidado."]}
 ],
 erros:["“Fator de risco é destino.” Não: é probabilidade populacional.","“Só hábitos individuais explicam a saúde mental.” Não: determinantes estruturais também importam."],
 resumo:["Fator de risco indica probabilidade em uma população.","Fatores de proteção modificam trajetórias.","Associações observacionais exigem cautela.","Determinantes estruturais precisam de políticas."],
 referencias:REF_CAP12,
 questoes:[
  {id:'m12-a7-q1',enunciado:"Fator de risco significa previsão inevitável?",alts:["Sim.", "Não; indica maior probabilidade populacional, e fatores de proteção podem modificar o caminho.", "Sim, se for genético.", "Sim, para crianças."],correta:1,justificativa:"Fatores de risco descrevem probabilidades em grupos. Não determinam o destino de uma pessoa."},
  {id:'m12-a7-q2',enunciado:"Por que estratégias só individuais podem ser insuficientes?",alts:["Porque hábitos não importam.", "Porque são caras.", "Porque podem ignorar determinantes estruturais como moradia, segurança e acesso a serviços.", "Porque não há hábitos saudáveis."],correta:2,justificativa:"Condições estruturais afetam a saúde mental de forma coletiva, e exigem respostas coletivas."}
 ],
 cartoes:[
  {id:'m12-a7-c1',frente:"O que é fator de proteção?",verso:"Condição que pode modificar a trajetória e reduzir a chance de um desfecho, dependendo do contexto."},
  {id:'m12-a7-c2',frente:"Fator de risco prevê o futuro de alguém?",verso:"Não. Indica maior probabilidade em uma população."}
 ]
},
'm12-a8':{
 modulo:12, titulo:"Classificação, linguagem e estigma", nivel:"Intermediário", tempo:20, disciplina:"Psicopatologia e saúde mental", fonte:"Caderno de Pesquisa, capítulo 12.8", alerta:ALERTA_CAP12,
 objetivos:["Entender categorias como ferramentas com limites","Diferenciar classificação, etiologia e planejamento de cuidado","Discutir críticas históricas e culturais às categorias"],
 previos:"Sintomas, sinais e classificações; estigma.",

  {t:"CID-11 e crítica", p:["A CID-11 é uma referência internacional desenvolvida pela OMS, mas sua utilização profissional depende das condições de implementação, avaliação e contexto. Um estudante pode aprender a diferença entre classificação, etiologia e planejamento de cuidado, sem reproduzir um manual diagnóstico completo ou aplicar seus critérios a colegas. Discussões acadêmicas devem incluir críticas históricas e culturais às categorias, sem negar que padrões de sofrimento e incapacidade podem exigir atenção e intervenção."]}
 ],
 erros:["“Categoria é a identidade da pessoa.” Não: é uma ferramenta.","“Criticar categorias é negar o sofrimento.” Não: são coisas diferentes."],
 resumo:["Categorias são ferramentas com critérios e limites.","Classificação, etiologia e planejamento são coisas distintas.","A linguagem pública influencia estigma e acesso.","Críticas às categorias convivem com a atenção ao sofrimento."],
 referencias:REF_CAP12,
 questoes:[
  {id:'m12-a8-q1',enunciado:"Qual diferença o estudante deve aprender?",alts:["Entre bonito e feio.", "Entre diagnóstico e opinião de amigos.", "Nenhuma.", "Entre classificação, etiologia e planejamento de cuidado."],correta:3,justificativa:"Classificar, explicar as causas e planejar o cuidado são tarefas diferentes."},
  {id:'m12-a8-q2',enunciado:"Críticas às categorias negam que sofrimento exige atenção?",alts:["Não; discussões críticas convivem com a atenção a padrões de sofrimento e incapacidade.", "Sim, sempre.", "Sim, se forem históricas.", "Sim, em pesquisas."],correta:0,justificativa:"Criticar as categorias não significa ignorar o sofrimento que elas tentam descrever."}
 ],
 cartoes:[
  {id:'m12-a8-c1',frente:"Categoria diagnóstica descreve a identidade de alguém?",verso:"Não. É uma ferramenta com critérios e limitações."},
  {id:'m12-a8-c2',frente:"Por que a linguagem pública importa?",verso:"Porque influencia o estigma, o acesso a serviços e a forma como as pessoas se compreendem."}
 ]
},
'm12-a9':{
 modulo:12, titulo:"Pesquisa sobre tratamentos e resultados", nivel:"Intermediário", tempo:20, disciplina:"Psicopatologia e saúde mental", fonte:"Caderno de Pesquisa, capítulo 12.9", alerta:ALERTA_CAP12,
 objetivos:["Fazer perguntas a um estudo de tratamento","Distinguir escala melhorada de mudança relevante para a pessoa","Entender a leitura de revisões sobre intervenções"],
 previos:"Cuidados, evidências e limites éticos.",
 previa:"Melhorar a pontuação de uma escala equivale a obter todas as mudanças relevantes para a pessoa?",
 previaResposta:"Não necessariamente. É preciso observar o que a escala mede, o que importa para a vida da pessoa e os efeitos adversos.",
 secoes:[
  {t:"Como ler estudos de tratamento", p:["A eficácia de uma intervenção deve ser examinada para problemas, desfechos, grupos e condições definidos. Estudos comparativos podem informar benefícios prováveis, limites e efeitos adversos. A aplicação individual depende de avaliação e competência profissional. Melhorar a pontuação de uma escala não equivale automaticamente a obter todas as mudanças relevantes para a pessoa."],
   pausa:{p:"Que três perguntas você faria a um estudo de tratamento?", r:"Qual problema e para qual grupo? Qual desfecho foi medido e é relevante para a vida da pessoa? Quais efeitos adversos e perdas de participantes foram relatados?"}},
  {t:"Revisões e limites", p:["O estudante deve observar condições de comparação, acompanhamento, perdas no estudo, preferência dos participantes e variações entre serviços. Revisões sistemáticas podem sintetizar evidências, mas precisam discutir heterogeneidade e qualidade metodológica. Atribuir resultados de estudos específicos a uma abordagem inteira simplifica debates. O PsicoBase deve explicar como ler essa literatura, mantendo distância de qualquer recomendação terapêutica personalizada."]}
 ],
 erros:["“A escala melhorou, então a vida melhorou.” Não necessariamente.","“Um estudo prova que a abordagem inteira funciona.” Não: resultados são específicos."],
 resumo:["Avalie problema, grupo, desfecho e efeitos adversos.","Escala melhorada não é garantia de mudança relevante.","Revisões exigem discutir heterogeneidade.","O app explica a leitura da literatura, sem recomendar tratamento."],
 referencias:REF_CAP12,
 questoes:[
  {id:'m12-a9-q1',enunciado:"Por que melhorar uma escala não basta?",alts:["Porque escalas são inúteis.", "Porque a escala pode não capturar todas as mudanças relevantes para a pessoa.", "Porque tratamentos não têm efeito.", "Porque escalas são caras."],correta:1,justificativa:"Uma escala mede aspectos específicos. Mudanças relevantes para a vida da pessoa podem não aparecer nela."},
  {id:'m12-a9-q2',enunciado:"O que uma revisão sistemática precisa discutir?",alts:["Apenas o título dos estudos.", "O preço dos tratamentos.", "Heterogeneidade e qualidade metodológica.", "Somente os resultados positivos."],correta:2,justificativa:"Sem discutir heterogeneidade e qualidade, a síntese pode simplificar demais os resultados."}
 ],
 cartoes:[
  {id:'m12-a9-c1',frente:"O que observar em um estudo de tratamento?",verso:"Problema, grupo, desfecho, efeitos adversos e perdas de participantes."},
  {id:'m12-a9-c2',frente:"Atribuir resultados de um estudo a toda uma abordagem é adequado?",verso:"Não. Simplifica debates e ignora a variação entre estudos e contextos."}
 ]
},
'm12-a10':{
 modulo:12, titulo:"Cuidado comunitário e direitos", nivel:"Intermediário", tempo:20, disciplina:"Psicopatologia e saúde mental", fonte:"Caderno de Pesquisa, capítulo 12.10", alerta:ALERTA_CAP12,
 objetivos:["Entender o cuidado como questão coletiva e de direitos","Identificar barreiras de acesso além da escolha individual","Verificar normas em fontes oficiais"],
 previos:"Pesquisa sobre tratamentos e resultados.",
 previa:"O cuidado em saúde mental é apenas uma escolha individual entre “querer ajuda” e “não querer ajuda”?",

   pausa:{p:"Quais barreiras podem afetar o acesso a cuidado, além da vontade da pessoa?", r:"Transporte, custos, horários, discriminação, falta de serviços no território e regras institucionais."}},
  {t:"SUS, RAPS e verificação", p:["No Brasil, o SUS e a RAPS oferecem contexto para discutir o cuidado em diferentes níveis e pontos de atenção. Normas e organização de serviços devem ser verificadas em fontes oficiais, pois podem mudar. A contribuição da Psicologia em redes sociais e de saúde precisa dialogar com a avaliação de resultados, a responsabilidade profissional e a participação das pessoas atendidas."]}

 resumo:["O cuidado depende de oferta, território e direitos.","Barreiras de acesso não são só individuais.","O SUS e a RAPS organizam o cuidado em níveis e pontos de atenção.","Normas devem ser verificadas em fontes oficiais."],
 referencias:REF_CAP12,
 questoes:[

  {id:'m12-a10-q2',enunciado:"Como verificar normas e a organização de serviços?",alts:["Consultar fontes oficiais, pois podem mudar.", "Confiar em qualquer postagem.", "Usar informações antigas.", "Não verificar."],correta:0,justificativa:"Fontes oficiais e atualizadas são o caminho para normas e serviços vigentes."}
 ],
 cartoes:[
  {id:'m12-a10-c1',frente:"O acesso ao cuidado depende só da vontade individual?",verso:"Não. Oferta, custos, transporte, discriminação e regras institucionais também contam."},
  {id:'m12-a10-c2',frente:"Por que verificar normas em fontes oficiais?",verso:"Porque serviços e normas podem mudar, e informações antigas levam a erros."}
 ]
},

function calcularStreak(){
 const dias = Object.keys(estado.minPorDia).filter(k=>estado.minPorDia[k]>0).sort().reverse();
 if(!dias.length) return 0;
 let streak=0;
 let atual=new Date();
 let check=dataISO(atual);
 if(!dias.includes(check)){
   atual.setDate(atual.getDate()-1);
   check=dataISO(atual);
   if(!dias.includes(check)) return 0;
 }
 while(dias.includes(check)){
   streak++;
   atual.setDate(atual.getDate()-1);
   check=dataISO(atual);
 }
 return streak;
}

function atualizarStreak(){
 const el=$('#streak-badge');
 if(el){
   const s=calcularStreak();
   el.textContent='🔥 ' + s + (s===1?' dia':' dias');
 }
}

function formatarTempoPomo(s){
 const m=Math.floor(s/60);
 const seg=s%60;
 return String(m).padStart(2,'0')+':'+String(seg).padStart(2,'0');
}
function togglePomodoro(){
 pomoAtivo=!pomoAtivo;
 const btn=$('#pomo-toggle');
 const box=$('#pomo-box');
 if(pomoAtivo){
   if(btn) btn.textContent='⏸';
   if(box) box.classList.add('ativo');
   pomoInterval=setInterval(()=>{
     if(pomoTempo>0){
       pomoTempo--;
       const disp=$('#pomo-display'); if(disp) disp.textContent=formatarTempoPomo(pomoTempo);
     }else{
       clearInterval(pomoInterval);
       pomoAtivo=false;
       if(btn) btn.textContent='▶';
       if(box) box.classList.remove('ativo');
       aviso('🎉 Parabéns! Ciclo Pomodoro concluído (+25 min de foco registrados).');
       const k=dataISO();
       estado.minPorDia[k]=(estado.minPorDia[k]||0)+25;
       salvar();
       pomoTempo=25*60;
     }
   },1000);
 }else{
   if(btn) btn.textContent='▶';
   if(box) box.classList.remove('ativo');
   clearInterval(pomoInterval);
 }
}
window.togglePomodoro = togglePomodoro;

function resetPomodoro(){
 clearInterval(pomoInterval);
 pomoAtivo=false;
 pomoTempo=25*60;
 const disp=$('#pomo-display'); if(disp) disp.textContent='25:00';
 const btn=$('#pomo-toggle'); if(btn) btn.textContent='▶';

function responderCartao(id,nivel){
 const c=estado.cartoes[id]; if(!c) return;
 let s=c.stage;
 if(nivel==='dificil') s=0;
 else if(nivel==='bom') s=Math.max(1,s);
 else if(nivel==='facil') s=Math.min(INTERVALOS.length-1,s+1);
 c.stage=s;
 c.prox=diaNum()+INTERVALOS[s];
 c.vezes++;
 c.historico.push({d:dataISO(), n:nivel});
 salvar();
}

let vozFalando=false;
function falarTexto(texto){
 if(!('speechSynthesis' in window)) return aviso('Síntese de voz não suportada pelo seu navegador.');
 if(vozFalando){
   window.speechSynthesis.cancel();
   vozFalando=false;
   const btn=$('#btn-audio-aula'); if(btn) btn.innerHTML='🔊 Ouvir Aula (Podcast)';
   return;
 }
 window.speechSynthesis.cancel();
 const utt=new SpeechSynthesisUtterance(texto);
 utt.lang='pt-BR';
 utt.rate=0.95; /* Leitura cadenciada e acolhedora */
 utt.onend=()=>{
   vozFalando=false;
   const btn=$('#btn-audio-aula'); if(btn) btn.innerHTML='🔊 Ouvir Aula (Podcast)';
 };
 vozFalando=true;
 window.speechSynthesis.speak(utt);
 const btn=$('#btn-audio-aula'); if(btn) btn.innerHTML='⏹ Pausar Áudio';
}

function estatisticas(){

 const concl=Object.keys(estado.aulasConcluidas).filter(id=>AULAS[id]).length;
 const minutos=Object.values(estado.minPorDia).reduce((a,b)=>a+b,0);

   concl:concl, totalAulas:Object.keys(AULAS).length,
   minutos:Math.round(minutos), pend:pend, previstas:previstas
 };
}

const CRISE_TERMOS_LISTA=['suicid','me matar','quero morrer','nao quero viver','não quero viver','acabar com a minha vida','automutil','me cortar','me machucar','autolesao'];

const RESPOSTA_CRISE_TXT="Sinto muito que você esteja passando por um momento tão delicado. Como Professor Virtual acadêmico, não tenho autorização para oferecer atendimento psicológico ou emergencial. "

+"Meu papel é exclusivamente didático. Posso explicar como a literatura científica aborda o tema de forma conceitual para fins de estudo acadêmico.";

async function chamarProfessorIA(mensagem, contextoAula){
 const mNorm=mensagem.toLowerCase();
 if(CRISE_TERMOS_LISTA.some(t=>mNorm.includes(t))) return {resposta:RESPOSTA_CRISE_TXT, fontes:['CVV (188)','SAMU (192)']};
 if(DIAG_TERMOS_LISTA.some(t=>mNorm.includes(t))) return {resposta:RESPOSTA_DIAG_TXT, fontes:['Código de Ética Profissional (CFP)']};

 // 1. Tentar conexão com API local (api_server.py)
 if(estado.apiServidor){
   try{
     const res=await fetch(estado.apiServidor.replace(/\/$/,'')+'/professor/chat',{
       method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({pergunta:mensagem, aula_id:contextoAula}),
       signal:AbortSignal.timeout(3500)
     });
     if(res.ok){
       const d=await res.json();
       if(d.resposta) return {resposta:d.resposta, fontes:d.fontes||['API PsicoBase']};
     }
   }catch(e){ /* Fallback automático para o motor offline */ }
 }

 // 2. Motor Heurístico/Offline embutido
 for(const [id, a] of Object.entries(AULAS)){
   if(mNorm.includes(a.titulo.toLowerCase()) || (a.objetivos||[]).some(o=>mNorm.includes(o.toLowerCase()))){
     const resumoTxt=(a.resumo||[]).join(' ');
     return {
       resposta:"Olá! Na aula **"+a.titulo+"**, investigamos exatamente essa temática.\n\n"
         +"📌 **Conceito Central:** "+(resumoTxt||a.secoes[0].p[0])+"\n\n"
         +"💡 **Reflexão Socrática:** Como você explicaria a distinção entre a definição popular desse termo e a sua formulação científica?",
       fontes:['Aula: '+a.titulo, a.disciplina]
     };
   }
 }

 return {
   resposta:"Excelente reflexão acadêmica! Para compreendermos esse aspecto na Psicologia, é crucial delimitarmos sob qual matriz epistemológica estamos trabalhando (Comportamental, Cognitiva, Psicanalítica ou Humanista).\n\n"
     +"Sugiro que você explore as aulas correspondentes na aba **Aprender** e consulte os termos fundamentais na **Biblioteca** para estruturar seu fichamento.",
   fontes:['Diretrizes Curriculares Nacionais (DCNs) de Psicologia','Plataforma PsicoBase']
 };
}

function corrigirAula(aulaId, form){
 const a = AULAS[aulaId];
 if(!a) return { acertos: 0, total: 0, res: [] };
 let acertos = 0;
 const res = [];
 (a.questoes || []).forEach(q => {
  const v = form.querySelector('input[name="'+q.id+'"]:checked');
  const marcada = v ? Number(v.value) : -1;
  const ok = (marcada === q.correta);
  if(ok) acertos++;
  res.push({ q: q, marcada: marcada, ok: ok });
  if(!Array.isArray(estado.tentativas)) estado.tentativas = [];
  estado.tentativas.push({ d: dataISO(), aula: aulaId, q: q.id, ok: ok, marcada: marcada });
 });
 salvar();
 return { acertos: acertos, total: (a.questoes || []).length, res: res };
}
window.corrigirAula = corrigirAula;

function mostrarResultado(r){
 if(!r || !r.total) return;
 const pct = Math.round((r.acertos / r.total) * 100);
 const linhas = (r.res || []).map(x => {
  const cls = x.ok ? 'ok' : 'erro';
  const rotulo = x.ok ? '✓ Resposta Correta' : '✕ Resposta Incorreta';
  const detalhe = x.ok ? '' : '<p style="margin:6px 0;font-size:0.92rem"><strong>Sua resposta:</strong> ' + (x.marcada >= 0 ? LETRAS[x.marcada] + ') ' + esc(x.q.alts[x.marcada]) : '<em class="muted">Não respondida</em>') + '.<br><strong style="color:var(--salvia)">Resposta esperada:</strong> ' + LETRAS[x.q.correta] + ') ' + esc(x.q.alts[x.q.correta]) + '.</p>';
  return '<div class="res ' + cls + '"><p style="margin:0 0 6px 0"><strong>' + rotulo + '.</strong> ' + esc(x.q.enunciado) + '</p>' + detalhe + '<p class="muted" style="margin:6px 0 0;font-size:0.88rem;border-top:1px dashed var(--borda-suave);padding-top:6px"><em>Fundamentação epistemológica:</em> ' + esc(x.q.justificativa) + '</p></div>';
 }).join('');
 
 const dica = (r.acertos === r.total) 
   ? 'Excelente domínio conceitual! Continue para a próxima aula ou consolide o conteúdo nas fichas de repetição espaçada.' 
   : 'Recomendamos reler os tópicos reflexivos associados aos pontos assinalados e praticar os flashcards desta aula.';

 const container = document.getElementById('resultado-quiz');
 if(container){
   container.innerHTML = '<div class="card destaque" style="margin-top:20px;border-left:5px solid ' + (pct >= 70 ? 'var(--salvia)' : 'var(--terracota)') + '">'
     + '<strong style="font-family:var(--font-serif);font-size:1.2rem;color:' + (pct >= 70 ? 'var(--salvia)' : 'var(--terracota)') + '">Desempenho Formativo: ' + r.acertos + ' de ' + r.total + ' (' + pct + '%)</strong>'
     + '<p style="margin:8px 0 0">' + dica + '</p>'
     + '</div>' + linhas;
   container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
 }
}
window.mostrarResultado = mostrarResultado;

  ).join('')
 +'</div>';

window.filtrarBiblioteca = function(q){
 const norm = q.toLowerCase().trim();
 const glosList = GLOSSARIO.concat(typeof GLOSSARIO_CAP!=='undefined'?GLOSSARIO_CAP:[]);
 const filtrados = glosList.filter(g => g.termo.toLowerCase().includes(norm) || (g.simples||'').toLowerCase().includes(norm));
 const el=$('#lista-biblio');
 if(!el) return;
 if(!filtrados.length){ el.innerHTML='<p class="muted">Nenhum termo encontrado para "'+esc(q)+'".</p>'; return; }
 el.innerHTML = filtrados.slice(0, 30).map(g=>''
  +'<div class="card" style="margin:12px 0">'
   +'<div style="display:flex;justify-content:space-between;align-items:center">'
    +'<h3 style="margin:0;color:var(--primaria);font-family:var(--font-serif)">'+esc(g.termo)+'</h3>'
    +(g.aula?'<a href="#/aula/'+g.aula+'" class="tag">Aula Relacionada</a>':'')
   +'</div>'
   +'<p style="margin:8px 0"><strong>Definição Semântica:</strong> '+esc(g.simples)+'</p>'
   +(g.academico?'<p class="muted" style="margin:6px 0"><strong>Rigor Acadêmico:</strong> '+esc(g.academico)+'</p>':'')
  +'</div>'
 ).join('');
};

};

window.exportarBackup = function(){
 const blob=new Blob([JSON.stringify(estado, null, 2)], {type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a'); a.href=url; a.download='psicobase-academico-'+dataISO()+'.json'; a.click();
 URL.revokeObjectURL(url);
};

window.importarBackup = function(e){
 const arq=e.target.files[0]; if(!arq) return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     const d=JSON.parse(r.result);
     if(d && typeof d==='object'){
       estado=Object.assign(estadoPadrao(), d);
       salvar();
       aviso('Backup acadêmico restaurado com sucesso!');
       render();
     }
   }catch(err){ aviso('Arquivo de backup inválido.'); }
 };
 r.readAsText(arq);
};

/* ==================== BUSCA MODAL (CTRL+K) ==================== */
function abrirBuscaModal(){
 const m=$('#modal-busca'); if(m){ m.style.display='flex'; $('#input-busca-modal').focus(); }
}
window.abrirBuscaModal = abrirBuscaModal;

function fecharBuscaModal(){
 const m=$('#modal-busca'); if(m) m.style.display='none';
}
window.fecharBuscaModal = fecharBuscaModal;

window.addEventListener('keydown', e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); abrirBuscaModal(); }
 if(e.key==='Escape') fecharBuscaModal();
});

function executarBuscaModal(q){
 const norm=q.toLowerCase().trim();
 const out=$('#modal-busca-resultados');
 if(!norm){ out.innerHTML='<p class="muted">Digite para pesquisar em aulas e no glossário.</p>'; return; }
 
 const aulasMatch = Object.entries(AULAS).filter(([id,a])=>a.titulo.toLowerCase().includes(norm));
 const termosMatch = GLOSSARIO.filter(g=>g.termo.toLowerCase().includes(norm));
 
 let h='';
 if(aulasMatch.length){
   h+='<strong style="font-family:var(--font-serif)">Aulas Encontradas:</strong><ul style="padding-left:22px;margin-top:6px">';
   aulasMatch.slice(0,5).forEach(([id,a])=>{
     h+='<li><a href="#/aula/'+id+'" onclick="fecharBuscaModal()">'+esc(a.titulo)+'</a> <span class="muted">('+esc(a.disciplina)+')</span></li>';
   });
   h+='</ul>';
 }
 if(termosMatch.length){
   h+='<strong style="font-family:var(--font-serif);margin-top:14px;display:block">Termos no Glossário:</strong><ul style="padding-left:22px;margin-top:6px">';
   termosMatch.slice(0,5).forEach(g=>{
     h+='<li><strong>'+esc(g.termo)+':</strong> '+esc(g.simples)+'</li>';
   });
   h+='</ul>';
 }
 if(!aulasMatch.length && !termosMatch.length){
   h='<p class="muted">Nenhum resultado para "'+esc(q)+'".</p>';
 }
 out.innerHTML=h;
}
window.executarBuscaModal = executarBuscaModal;

/* ==================== ROTEADOR ==================== */
function render(){
 encerrarSessao();
 const partes=rota().split('/').filter(Boolean);
 const r=partes[0]||'inicio';
 
 if(!estado.perfil && r!=='bem-vindo'){ location.hash='#/bem-vindo'; return; }
 if(estado.perfil && r==='bem-vindo'){ location.hash='#/inicio'; return; }
 if(r!=='revisar'){ filaRev=null; }
 
 let html='';
 switch(r){
  case 'bem-vindo': html=viewBemVindo(); break;
  case 'inicio': html=viewInicio(); break;
  case 'aprender': html=viewAprender(); break;
  case 'modulo': html=viewModulo(partes[1]); break;
  case 'aula': html=viewAula(partes[1]); break;
  case 'revisar': html=viewRevisar(); break;
  case 'professor': html=viewProfessor(); break;
  case 'biblioteca': html=viewBiblioteca(); break;
  case 'perfil': html=viewPerfil(); break;
  default: html='<h1>Página não encontrada</h1><p><a href="#/inicio">Voltar ao início</a></p>';
 }
 app.innerHTML=html;
 
 const showNav=estado.perfil && r!=='bem-vindo';
 nav.hidden=!showNav;
 header.hidden=!showNav;
 
 document.querySelectorAll('nav.inferior a').forEach(a=>{
  const ativo=a.dataset.nav===r || ((r==='modulo'||r==='aula')&&a.dataset.nav==='aprender');
  if(ativo) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
 });
 
 document.title=(r==='inicio'||!estado.perfil?'PsicoBase · Acolhimento e Rigor na Psicologia':'PsicoBase · '+r.toUpperCase());
 window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);

/* ==================== INICIALIZAÇÃO ==================== */
aplicarVisual();
render();

})();
</script>
